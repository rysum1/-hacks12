<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sculpt Studio</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1f24;
               font-family: system-ui, sans-serif; color: #eee; }
  canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  #ui { position: absolute; top: 12px; left: 12px; width: 258px; padding: 12px 14px;
        max-height: calc(100vh - 48px); overflow-y: auto; box-sizing: border-box;
        background: rgba(20,22,26,.88); border-radius: 10px; font-size: 13px;
        line-height: 1.6; user-select: none; }
  #ui label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #ui input[type=range] { width: 115px; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  button { flex: 1; background: #2c3038; color: #eee; border: 1px solid #444a55;
           border-radius: 6px; padding: 5px; cursor: pointer; font-size: 12px; }
  button:hover { background: #363b45; }
  button.active { background: #4a7bd0; border-color: #4a7bd0; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; opacity: .55;
           margin: -4px 0 4px 105px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
  .tools .wide { grid-column: span 2; }
  .swatches { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
  .swatches span { width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
                   border: 2px solid transparent; box-sizing: border-box; }
  .swatches span.active { border-color: #fff; }
  #paintColor { width: 30px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; }
  select { width: 125px; background: #2c3038; color: #eee; border: 1px solid #444a55;
           border-radius: 6px; padding: 3px; font-size: 12px; }
  #status { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
            max-width: min(760px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 10px;
            background: rgba(20,22,26,.9); font-size: 14px; line-height: 1.45; text-align: center;
            display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: center; }
  #status button { flex: none; font-size: 13px; padding: 6px 10px; }
  #status button.primary { background: #d9a832; border-color: #d9a832; color: #1d1f24; font-weight: 600; }
  #status b { color: #ffcc55; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #ffcc55; outline-offset: 2px; }
  .section { margin-top: 10px; font-weight: 600; opacity: .85; }
  canvas.orbiting { cursor: grab; }
  canvas.orbiting:active { cursor: grabbing; }
  .hint { opacity: .65; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="ui">
  <b>Sculpt Studio</b>
  <div class="tools">
    <button id="btnChisel" class="active">Chisel (X)</button>
    <button id="btnHammer">Hammer (H)</button>
    <button id="btnSmooth">Sandpaper (S)</button>
    <button id="btnPaint">Paint (P)</button>
  </div>
  <label id="sizeRow">Brush size <input id="size" type="range" min="0.05" max="0.4" step="0.01" value="0.12"></label>
  <label>Strength <input id="strength" type="range" min="0.1" max="1" step="0.05" value="0.5"></label>
  <div id="paintPanel" hidden>
    <div class="section">Paint</div>
    <div class="swatches">
      <input id="paintColor" type="color" value="#c0392b" title="Pick any colour">
      <span data-color="#c0392b"></span><span data-color="#e67e22"></span><span data-color="#f1c40f"></span>
      <span data-color="#27ae60"></span><span data-color="#2980b9"></span><span data-color="#8e44ad"></span>
      <span data-color="#f5f5f0"></span><span data-color="#222222"></span>
    </div>
    <div class="row"><button id="btnErase">Eraser (E)</button></div>
  </div>
  <div id="chiselPanel" hidden>
    <div class="section">Chisel</div>
    <div class="row" id="chiselSizes">
      <button data-chisel="small">Small</button>
      <button data-chisel="medium" class="active">Medium</button>
      <button data-chisel="large">Large</button>
    </div>
    <label>Angle (R/F) <input id="chiselAngle" type="range" min="0" max="85" step="1" value="35" aria-label="Chisel angle"></label>
    <div class="scale"><span>Straight in</span><span>Skimming</span></div>
    <label>Chip shape
      <select id="chipShape" aria-label="Chip shape">
        <option value="random">Random</option>
        <option value="wedge">Wedge</option>
        <option value="block">Block</option>
        <option value="shard">Shard</option>
        <option value="flake">Flake</option>
        <option value="splinter">Splinter</option>
      </select>
    </label>
  </div>
  <div id="hammerPanel" hidden>
    <div class="section">Hammer</div>
    <div class="row" id="hammerSizes">
      <button data-hammer="small">Small</button>
      <button data-hammer="medium" class="active">Medium</button>
      <button data-hammer="large">Large</button>
    </div>
    <label>Depth (R/F) <input id="hammerDepth" type="range" min="0.05" max="1.2" step="0.05" value="0.3" aria-label="Hammer cut depth"></label>
    <div class="scale"><span>Shallow</span><span>Deep</span></div>
  </div>
  <div class="row" id="debrisRow"><button id="btnClearDebris">Clear debris</button></div>
  <div class="row">
    <button id="btnUndo">Undo (Ctrl+Z)</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="row"><button id="btnExport">Export STL</button></div>
  <div class="section">Camera</div>
  <div class="row"><button id="btnCamMode">Move camera (V)</button></div>
  <div class="row">
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="top">Top</button>
    <button data-view="home">Reset</button>
  </div>
</div>

<div id="status" role="status" aria-live="polite">
  <span id="statusText"></span>
  <span id="aimButtons" hidden>
    <button id="btnReroll" title="Pick a different chip (Random mode)">↻ Other chip</button>
    <button id="btnStrike" class="primary">Strike (Enter)</button>
    <button id="btnCancelAim">Cancel (Esc)</button>
  </span>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// ENGINE START
// ---------------------------------------------------------------------------
// SculptVolume: the "clay". Stores a signed distance field (SDF) on a 3D grid.
//   field < 0  -> inside the material
//   field > 0  -> empty space
// Carving/adding are just min/max operations with a sphere SDF, and the
// visible surface is extracted with Surface Nets (a simpler cousin of
// Marching Cubes that gives smooth, watertight meshes).
// ---------------------------------------------------------------------------
// Small 3D value-noise helpers (used for rough, irregular fracture surfaces).
function hash3i(x, y, z, seed) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1440662683) + Math.imul(seed, 1103515245)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise3(x, y, z, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let fx = x - xi, fy = y - yi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const l = (a, b, t) => a + (b - a) * t, H = (a, b, c) => hash3i(xi + a, yi + b, zi + c, seed);
  return l(l(l(H(0, 0, 0), H(1, 0, 0), fx), l(H(0, 1, 0), H(1, 1, 0), fx), fy),
           l(l(H(0, 0, 1), H(1, 0, 1), fx), l(H(0, 1, 1), H(1, 1, 1), fx), fy), fz);
}
function fbm3(x, y, z, seed) {
  return 0.6 * vnoise3(x, y, z, seed) + 0.3 * vnoise3(x * 2.1, y * 2.1, z * 2.1, seed + 7) + 0.1 * vnoise3(x * 4.3, y * 4.3, z * 4.3, seed + 13);
}

// The five chip shapes. Each returns a signed-distance function in the chip's
// local frame (u forward, v across, w out of the surface); negative = inside.
// Every shape pokes a little above the surface so the chip breaks cleanly out.
function sdBox(u, v, w, bu, bv, bw) {
  const qu = Math.abs(u) - bu, qv = Math.abs(v) - bv, qw = Math.abs(w) - bw;
  return Math.hypot(Math.max(qu, 0), Math.max(qv, 0), Math.max(qw, 0)) + Math.min(Math.max(qu, qv, qw), 0);
}
const CHIP_SHAPES = ['wedge', 'block', 'shard', 'flake', 'splinter'];
// Each factory takes (size, st) where st = sin(chisel tilt) and returns the
// distance function, tagged with:
//   ext  - half-extents [u, v, w] (for a tight bounding box)
//   thin - its thinnest feature (so the chip's own grid can be fine enough)
const shapeFn = (fn, ext, thin) => Object.assign(fn, { ext, thin });
const CHIP_SDF = {
  // Triangular prism: flat top at the surface, V-shaped bottom, runs across the blade.
  wedge: s => {
    const top = 0.15 * s, half = 0.6 * s, apex = -0.6 * s, hv = 0.5 * s;
    const el = Math.hypot(top - apex, half), nu = (top - apex) / el, nw = -half / el;
    return shapeFn((u, v, w) => Math.max(Math.abs(v) - hv, w - top, (Math.abs(u) - half) * nu + (w - top) * nw) - 0.02 * s,
                   [0.62 * s, 0.52 * s, 0.62 * s], 0.3 * s);
  },
  // Chunky rounded cube.
  block: s => shapeFn((u, v, w) => sdBox(u, v, w + 0.15 * s, 0.45 * s, 0.42 * s, 0.38 * s) - 0.07 * s,
                      [0.52 * s, 0.49 * s, 0.6 * s], 0.4 * s),
  // Four-sided pyramid pointing into the stone.
  shard: s => {
    const top = 0.12 * s, half = 0.5 * s, apex = -0.75 * s;
    const el = Math.hypot(top - apex, half), nx = (top - apex) / el, nw = -half / el;
    const side = (x, w) => (Math.abs(x) - half) * nx + (w - top) * nw;
    return shapeFn((u, v, w) => Math.max(w - top, side(u, w), side(v, w)) - 0.015 * s,
                   [0.52 * s, 0.52 * s, 0.77 * s], 0.25 * s);
  },
  // Thin oval slab - the typical glancing-blow flake.
  flake: (s, st) => {
    const ra = s * (0.9 + 0.4 * st), rb = 0.7 * s, rc = 0.22 * s;
    return shapeFn((u, v, w) => {
      w += 0.05 * s;
      const k0 = Math.hypot(u / ra, v / rb, w / rc), k1 = Math.hypot(u / (ra * ra), v / (rb * rb), w / (rc * rc));
      return k1 > 0 ? k0 * (k0 - 1) / k1 : -rc;
    }, [ra, rb, rc + 0.05 * s], rc);
  },
  // Flat, plank-like sliver lying along the direction of the blow: wide across,
  // thin top-to-bottom, tapering toward both ends. The shallower the strike
  // (past ~65 deg), the longer and thinner it gets, shaved from just under
  // the surface - a skimmed sliver.
  splinter: (s, st) => {
    const shallow = Math.min(1, Math.max(0, (st - 0.9) / 0.096));      // 0 at 65 deg .. 1 at 85 deg
    const th = s * (0.12 - 0.06 * shallow);                             // half-thickness 0.12s -> 0.06s
    const W = s * (0.34 + 0.06 * shallow);                              // half-width at the middle
    const L = s * (0.9 + 0.6 * shallow);                                // half-length 0.9s -> 1.5s
    const sink = th * (0.4 + 0.2 * shallow);                            // how far below the surface
    const bevel = 0.35 * th;                                            // softened edges
    return shapeFn((u, v, w) => {
      w += sink;
      const taper = 1 - 0.55 * (u / L) * (u / L);                       // narrower toward the ends
      return Math.max(Math.abs(v) - W * taper, Math.abs(w) - th + bevel, Math.abs(u) - L) - bevel;
    }, [L, W, th + sink], th);
  },
};

class SculptVolume {
  constructor({ size = [2, 1.2, 1], cell = 0.025, pad = 3 } = {}) {
    this.size = size;
    this.baseJ = 0;   // set in reset(): grid row of the block's base (the "ground" it stands on)
    this.h = cell;                                         // grid spacing (world units)
    this.n = size.map(s => Math.ceil(s / cell) + 1 + 2 * pad); // points per axis
    this.origin = this.n.map(n => -(n - 1) * cell / 2);    // grid centred on 0,0,0
    this.field = new Float32Array(this.n[0] * this.n[1] * this.n[2]);
    // Paint lives in the same grid: RGBA per point (A = how much paint covers it).
    // Because it's stored in 3D, it stays put when the mesh is rebuilt.
    this.paint = new Uint8Array(this.field.length * 4);
    this.reset();
  }

  // Fill the grid with the SDF of a rectangular prism.
  reset() {
    this.paint.fill(0);
    const [nx, ny, nz] = this.n, h = this.h, o = this.origin;
    this.baseJ = Math.ceil((-this.size[1] / 2 - o[1]) / h) + 1;
    const b = this.size.map(s => s / 2);
    let idx = 0;
    for (let k = 0; k < nz; k++) {
      const qz = Math.abs(o[2] + k * h) - b[2];
      for (let j = 0; j < ny; j++) {
        const qy = Math.abs(o[1] + j * h) - b[1];
        for (let i = 0; i < nx; i++, idx++) {
          const qx = Math.abs(o[0] + i * h) - b[0];
          const ox = Math.max(qx, 0), oy = Math.max(qy, 0), oz = Math.max(qz, 0);
          this.field[idx] = Math.hypot(ox, oy, oz) + Math.min(Math.max(qx, qy, qz), 0);
        }
      }
    }
  }

  // Smooth brush weight: 1 at the centre, easing to 0 at the rim (no hard edge).
  static falloff(t) { if (t >= 1) return 0; const u = 1 - t * t; return u * u; }

  // Grid index range for a box (centre +- half-extents), kept off the shell.
  _rangeBox(center, he) {
    const h = this.h, o = this.origin, lo = [0, 0, 0], hi = [0, 0, 0];
    for (let a = 0; a < 3; a++) {
      lo[a] = Math.max(1, Math.floor((center[a] - he[a] - o[a]) / h));
      hi[a] = Math.min(this.n[a] - 2, Math.ceil((center[a] + he[a] - o[a]) / h));
    }
    return { lo, hi };
  }

  // Grid index range covered by a brush, kept off the outer shell of the grid
  // so the mesh can never open up at the boundary.
  _range(center, radius) {
    const h = this.h, o = this.origin, lo = [0, 0, 0], hi = [0, 0, 0];
    for (let a = 0; a < 3; a++) {
      lo[a] = Math.max(1, Math.floor((center[a] - radius - o[a]) / h));
      hi[a] = Math.min(this.n[a] - 2, Math.ceil((center[a] + radius - o[a]) / h));
    }
    return { lo, hi };
  }

  // Carve or add material. `depth` is how far the surface moves at the brush
  // centre for this one dab; it fades smoothly to nothing at the rim, which is
  // what makes strokes read as soft grooves instead of chains of round pits.
  brush(center, radius, depth, mode) {
    const [nx, ny] = this.n, h = this.h, o = this.origin, f = this.field;
    const { lo, hi } = this._range(center, radius);
    const sign = mode === 'add' ? -1 : 1;     // raising the field removes material
    for (let k = lo[2]; k <= hi[2]; k++) {
      const dz = o[2] + k * h - center[2];
      for (let j = lo[1]; j <= hi[1]; j++) {
        const dy = o[1] + j * h - center[1];
        let idx = lo[0] + nx * (j + ny * k);
        for (let i = lo[0]; i <= hi[0]; i++, idx++) {
          const dx = o[0] + i * h - center[0];
          const w = SculptVolume.falloff(Math.sqrt(dx * dx + dy * dy + dz * dz) / radius);
          if (w > 0) f[idx] += sign * depth * w;
        }
      }
    }
  }

  // Relax the field toward the average of its neighbours: sands off ridges,
  // tool marks and stair-steps while keeping the overall shape.
  smooth(center, radius, amount) {
    const [nx, ny] = this.n, h = this.h, o = this.origin, f = this.field;
    const { lo, hi } = this._range(center, radius);
    const sx = hi[0] - lo[0] + 1, sy = hi[1] - lo[1] + 1, sz = hi[2] - lo[2] + 1;
    const out = new Float32Array(sx * sy * sz);
    const Y = nx, Z = nx * ny;
    let t = 0;
    for (let k = lo[2]; k <= hi[2]; k++) for (let j = lo[1]; j <= hi[1]; j++) for (let i = lo[0]; i <= hi[0]; i++, t++) {
      const idx = i + nx * (j + ny * k);
      const dx = o[0] + i * h - center[0], dy = o[1] + j * h - center[1], dz = o[2] + k * h - center[2];
      const w = amount * SculptVolume.falloff(Math.sqrt(dx * dx + dy * dy + dz * dz) / radius);
      const avg = (f[idx - 1] + f[idx + 1] + f[idx - Y] + f[idx + Y] + f[idx - Z] + f[idx + Z]) / 6;
      out[t] = f[idx] + (avg - f[idx]) * w;
    }
    t = 0;   // write back after reading, so the result doesn't depend on loop order
    for (let k = lo[2]; k <= hi[2]; k++) for (let j = lo[1]; j <= hi[1]; j++) for (let i = lo[0]; i <= hi[0]; i++, t++)
      f[i + nx * (j + ny * k)] = out[t];
  }

  // Paint onto the surface. Only grid points within ~2 cells of the surface are
  // coloured, so paint is a thin skin: carving through it exposes bare stone.
  // rgb: [0..255]x3, amount: 0..1 coverage per dab, erase: remove paint instead.
  paintSphere(center, radius, rgb, amount, erase = false) {
    const [nx, ny] = this.n, h = this.h, o = this.origin, f = this.field, P = this.paint;
    const { lo, hi } = this._range(center, radius);
    const band = 2 * h;
    for (let k = lo[2]; k <= hi[2]; k++) {
      const dz = o[2] + k * h - center[2];
      for (let j = lo[1]; j <= hi[1]; j++) {
        const dy = o[1] + j * h - center[1];
        let idx = lo[0] + nx * (j + ny * k);
        for (let i = lo[0]; i <= hi[0]; i++, idx++) {
          if (f[idx] > band || f[idx] < -band) continue;
          const dx = o[0] + i * h - center[0];
          const w = amount * SculptVolume.falloff(Math.sqrt(dx * dx + dy * dy + dz * dz) / radius);
          if (w <= 0) continue;
          const q = idx * 4, a = P[q + 3] / 255;
          if (erase) { P[q + 3] = Math.floor(P[q + 3] * (1 - w)); continue; }
          const t = a > 0 ? w : 1;                       // unpainted: take the colour outright
          for (let c = 0; c < 3; c++) P[q + c] = Math.round(P[q + c] + (rgb[c] - P[q + c]) * t);
          P[q + 3] = Math.min(255, Math.ceil(255 * (a + (1 - a) * w)));
        }
      }
    }
  }

  // Field value at any world point (trilinear); outside the grid = empty space.
  sample(x, y, z) {
    const [nx, ny, nz] = this.n, h = this.h, o = this.origin, f = this.field;
    const gx = (x - o[0]) / h, gy = (y - o[1]) / h, gz = (z - o[2]) / h;
    if (gx < 0 || gy < 0 || gz < 0 || gx >= nx - 1 || gy >= ny - 1 || gz >= nz - 1) return 1;
    const i = gx | 0, j = gy | 0, k = gz | 0, fx = gx - i, fy = gy - j, fz = gz - k;
    const b = i + nx * (j + ny * k), Y = nx, Z = nx * ny;
    const l = (a, c, t) => a + (c - a) * t;
    return l(l(l(f[b], f[b + 1], fx), l(f[b + Y], f[b + Y + 1], fx), fy),
             l(l(f[b + Z], f[b + Z + 1], fx), l(f[b + Z + Y], f[b + Z + Y + 1], fx), fy), fz);
  }
  // Outward direction at a point (unit), from the field gradient.
  gradient(x, y, z) {
    const e = this.h;
    const g = [this.sample(x + e, y, z) - this.sample(x - e, y, z),
               this.sample(x, y + e, z) - this.sample(x, y - e, z),
               this.sample(x, y, z + e) - this.sample(x, y, z - e)];
    const len = Math.hypot(g[0], g[1], g[2]) || 1;
    return [g[0] / len, g[1] / len, g[2] / len];
  }

  // Copy a box of the grid out as its own small grid (used for broken pieces).
  // keep(idx, value) decides the piece's field value at each point.
  _cutOut(lo, hi, keep) {
    const [nx, ny] = this.n, h = this.h, o = this.origin, f = this.field, P = this.paint;
    const sn = [hi[0] - lo[0] + 1, hi[1] - lo[1] + 1, hi[2] - lo[2] + 1];
    const field = new Float32Array(sn[0] * sn[1] * sn[2]);
    const paint = new Uint8Array(field.length * 4);
    let t = 0, count = 0;
    for (let k = lo[2]; k <= hi[2]; k++) for (let j = lo[1]; j <= hi[1]; j++) for (let i = lo[0]; i <= hi[0]; i++, t++) {
      const idx = i + nx * (j + ny * k);
      let v = keep(idx, i, j, k);
      // The piece's outer shell must be empty so its mesh is closed.
      if (i === lo[0] || i === hi[0] || j === lo[1] || j === hi[1] || k === lo[2] || k === hi[2]) v = Math.max(v, h);
      field[t] = v;
      if (v < 0) count++;
      paint[t * 4] = P[idx * 4]; paint[t * 4 + 1] = P[idx * 4 + 1];
      paint[t * 4 + 2] = P[idx * 4 + 2]; paint[t * 4 + 3] = P[idx * 4 + 3];
    }
    return { field, paint, n: sn, h, count,
             origin: [o[0] + lo[0] * h, o[1] + lo[1] * h, o[2] + lo[2] * h] };
  }

  // Strike with a chisel. Removes a chip of one of the CHIP_SHAPES from the
  // stone and returns that chip as its own grid (or null if the blow hit
  // nothing solid). The hole and the falling chip are the same shape.
  //   tip   - point on the surface where the blade lands
  //   n     - outward surface normal (unit)
  //   t     - unit tangent the chip breaks toward (away from the handle)
  //   tilt  - radians: 0 = driven straight in (pit), larger = glancing (long flake)
  //   size  - chip size in world units, rough - 0..1 surface grit, seed - random seed
  //   shape - one of CHIP_SHAPES
  chisel(tip, n, t, tilt, size, rough, seed, shape = 'wedge') {
    const setup = this._chipSetup(tip, n, t, tilt, size, rough, seed, shape);
    const piece = this._chipGrid(setup);
    if (!piece.bitStone) return null;                        // blade hit only air
    // The block loses the chip. The hole is grown by a hair so even a chip
    // thinner than the block's grid still leaves a visible groove.
    const [nx, ny] = this.n, h = this.h, o = this.origin, f = this.field, chip = setup.chip;
    const grow = 0.3 * h;
    const { lo, hi } = this._rangeBox(setup.center, setup.he);
    for (let k = lo[2]; k <= hi[2]; k++) for (let j = lo[1]; j <= hi[1]; j++) {
      let idx = lo[0] + nx * (j + ny * k);
      for (let i = lo[0]; i <= hi[0]; i++, idx++)
        f[idx] = Math.max(f[idx], grow - chip(o[0] + i * h, o[1] + j * h, o[2] + k * h));
    }
    return piece;
  }

  // Hammer: knock a rectangular block out of the stone.
  //   c      - point on the surface at the middle of the rectangle
  //   u, v   - unit tangent axes of the rectangle, n - outward normal
  //   hu, hv - half width / half height of the rectangle
  //   depth  - how deep below the surface the cut goes
  // Everything inside that footprint, from the cut line out past the surface,
  // comes away as one piece. apply=false only builds the piece (for previews).
  hammer(c, u, v, n, hu, hv, depth, seed, apply = true) {
    const [nx, ny] = this.n, h = this.h, o = this.origin, f = this.field;
    const outer = 0.3;                                      // reach above the surface (bumps included)
    const cw = (outer - depth) / 2, hw = (outer + depth) / 2;
    const amp = apply ? 0.25 * h : 0, freq = 6;             // faintly rough break faces (skipped in previews)
    const box = (x, y, z) => {
      const dx = x - c[0], dy = y - c[1], dz = z - c[2];
      const lu = dx * u[0] + dy * u[1] + dz * u[2], lv = dx * v[0] + dy * v[1] + dz * v[2], lw = dx * n[0] + dy * n[1] + dz * n[2];
      const d = sdBox(lu, lv, lw - cw, hu, hv, hw);
      return amp ? d + amp * (2 * fbm3(x * freq, y * freq, z * freq, seed) - 1) : d;
    };
    const center = [0, 1, 2].map(a => c[a] + n[a] * cw);
    const he = [0, 1, 2].map(a => Math.abs(u[a]) * hu + Math.abs(v[a]) * hv + Math.abs(n[a]) * hw + amp + 2 * h);
    const { lo, hi } = this._rangeBox(center, he);
    const plo = lo.map(x => Math.max(0, x - 1)), phi = hi.map((x, a) => Math.min(this.n[a] - 1, x + 1));
    let stone = 0;
    // The piece = stone AND box (keeps the stone's real outer faces).
    const piece = this._cutOut(plo, phi, (idx, i, j, k) => {
      const d = box(o[0] + i * h, o[1] + j * h, o[2] + k * h);
      if (d < 0 && f[idx] < 0) stone++;
      return Math.max(f[idx], d);
    });
    if (!stone) return null;
    if (apply) {
      for (let k = lo[2]; k <= hi[2]; k++) for (let j = lo[1]; j <= hi[1]; j++) {
        let idx = lo[0] + nx * (j + ny * k);
        for (let i = lo[0]; i <= hi[0]; i++, idx++) f[idx] = Math.max(f[idx], -box(o[0] + i * h, o[1] + j * h, o[2] + k * h));
      }
    }
    return piece;
  }

  // Same chip as chisel() with the same arguments, without cutting anything:
  // lets the app show exactly what a strike will break off before it happens.
  // Built on a coarser grid so it's fast enough to update while aiming.
  // piece.bitStone === 0 means the blade would only hit air.
  chipPreview(tip, n, t, tilt, size, rough, seed, shape = 'wedge') {
    return this._chipGrid(this._chipSetup(tip, n, t, tilt, size, rough, seed, shape), true);
  }

  _chipSetup(tip, n, t, tilt, size, rough, seed, shape) {
    const h = this.h, st = Math.sin(tilt);
    const b = [n[1] * t[2] - n[2] * t[1], n[2] * t[0] - n[0] * t[2], n[0] * t[1] - n[1] * t[0]];
    // Local chip frame: u = forward (ahead of the blade), v = across, w = out of the surface.
    // Glancing blows shift the chip forward, ahead of where the blade lands.
    const fwd = size * 0.45 * st;
    const cx = tip[0] + t[0] * fwd, cy = tip[1] + t[1] * fwd, cz = tip[2] + t[2] * fwd;
    const sdf = CHIP_SDF[shape](size, st);
    const amp = size * 0.04 * (0.5 + rough), freq = 3 / size;   // a little grit, shape stays clean
    const chip = (x, y, z) => {
      const dx = x - cx, dy = y - cy, dz = z - cz;
      const u = dx * t[0] + dy * t[1] + dz * t[2], v = dx * b[0] + dy * b[1] + dz * b[2], w = dx * n[0] + dy * n[1] + dz * n[2];
      return sdf(u, v, w) + amp * (2 * fbm3(x * freq, y * freq, z * freq, seed) - 1);
    };
    // Axis-aligned box around the (rotated) chip.
    const [eu, ev, ew] = sdf.ext, pad = amp + 2 * h;
    const he = [0, 1, 2].map(a => Math.abs(t[a]) * eu + Math.abs(b[a]) * ev + Math.abs(n[a]) * ew + pad);
    return { chip, he, center: [cx, cy, cz], thin: sdf.thin, shape };
  }

  // The chip gets its OWN grid, built straight from the shape and fine enough
  // for its thinnest part, so slim splinters stay crisp.
  _chipGrid({ chip, he, center, thin, shape }, preview = false) {
    const [nx, ny] = this.n, h = this.h, o = this.origin, P = this.paint;
    const hp = preview ? Math.max(h / 2, Math.min(h, thin / 1.2))
                       : Math.max(h / 4, Math.min(h / 2, thin / 1.5));
    const pn = he.map(e => Math.ceil(2 * e / hp) + 3);
    const po = center.map((c0, a) => c0 - he[a] - hp);
    const pf = new Float32Array(pn[0] * pn[1] * pn[2]), pp = new Uint8Array(pf.length * 4);
    let t0 = 0, count = 0, bitStone = 0;
    for (let k = 0; k < pn[2]; k++) for (let j = 0; j < pn[1]; j++) for (let i = 0; i < pn[0]; i++, t0++) {
      const x = po[0] + i * hp, y = po[1] + j * hp, z = po[2] + k * hp;
      let d = chip(x, y, z);
      if (i === 0 || j === 0 || k === 0 || i === pn[0] - 1 || j === pn[1] - 1 || k === pn[2] - 1) d = Math.max(d, hp);
      pf[t0] = d;
      if (d < 0) { count++; if (this.sample(x, y, z) < 0) bitStone++; }
      // Paint: nearest point of the main grid.
      const gi = Math.min(nx - 1, Math.max(0, Math.round((x - o[0]) / h)));
      const gj = Math.min(ny - 1, Math.max(0, Math.round((y - o[1]) / h)));
      const gk = Math.min(this.n[2] - 1, Math.max(0, Math.round((z - o[2]) / h)));
      const q = (gi + nx * (gj + ny * gk)) * 4;
      pp[t0 * 4] = P[q]; pp[t0 * 4 + 1] = P[q + 1]; pp[t0 * 4 + 2] = P[q + 2]; pp[t0 * 4 + 3] = P[q + 3];
    }
    return { field: pf, paint: pp, n: pn, origin: po, h: hp, count, bitStone, shape };
  }

  // Flood-fill the solid stone starting from the base. Any chunk that isn't
  // connected to the bottom of the block has nothing holding it up, so it is
  // cut out of the block and returned as separate pieces (which then fall).
  detachFloating() {
    const [nx, ny, nz] = this.n, f = this.field, N = f.length, h = this.h;
    const label = new Int32Array(N);            // 0 = not visited
    const queue = new Int32Array(N);            // each chunk ends up as one contiguous run
    const Y = nx, Z = nx * ny, comps = [];
    let tail = 0;
    for (let s = 0; s < N; s++) {
      if (f[s] >= 0 || label[s]) continue;
      const id = comps.length + 1, start = tail;
      const lo = [nx, ny, nz], hi = [0, 0, 0];
      let head = tail, anchored = false;
      label[s] = id; queue[tail++] = s;
      while (head < tail) {
        const q = queue[head++];
        const k = (q / Z) | 0, r = q - k * Z, j = (r / nx) | 0, i = r - j * nx;
        if (j <= this.baseJ) anchored = true;
        if (i < lo[0]) lo[0] = i; if (i > hi[0]) hi[0] = i;
        if (j < lo[1]) lo[1] = j; if (j > hi[1]) hi[1] = j;
        if (k < lo[2]) lo[2] = k; if (k > hi[2]) hi[2] = k;
        // Solid points never sit on the grid's outer shell, so neighbours are in range.
        const nb = [q - 1, q + 1, q - Y, q + Y, q - Z, q + Z];
        for (let m = 0; m < 6; m++) { const qq = nb[m]; if (f[qq] < 0 && !label[qq]) { label[qq] = id; queue[tail++] = qq; } }
      }
      comps.push({ id, start, end: tail, anchored, lo, hi });
    }
    // If the base itself was carved away, the biggest chunk stays put.
    if (comps.length && !comps.some(c => c.anchored))
      comps.reduce((a, c) => (c.end - c.start > a.end - a.start ? c : a)).anchored = true;

    const pieces = [];
    for (const c of comps) {
      if (c.anchored) continue;
      const lo = c.lo.map(v => Math.max(0, v - 2)), hi = c.hi.map((v, a) => Math.min(this.n[a] - 1, v + 2));
      // Inside the box, only this chunk counts as solid.
      pieces.push(this._cutOut(lo, hi, idx => (f[idx] < 0 && label[idx] !== c.id) ? h : f[idx]));
      for (let q = c.start; q < c.end; q++) { const idx = queue[q]; f[idx] = Math.max(-f[idx], 0.25 * h); }
    }
    return pieces;
  }

  snapshot() { return { field: this.field.slice(), paint: this.paint.slice() }; }
  restore(s) { this.field.set(s.field); this.paint.set(s.paint); }

  // Surface Nets: one vertex per grid cell that the surface passes through,
  // one quad per grid edge that crosses the surface.
  mesh() { return SculptVolume.meshGrid(this); }

  // Works on any grid object { field, paint, n, origin, h } - the main block or
  // a small broken-off piece - so fragments are meshed the same way.
  static meshGrid(g) {
    const [nx, ny, nz] = g.n, h = g.h, o = g.origin, f = g.field;
    const cx = nx - 1, cy = ny - 1, cz = nz - 1;
    const pStride = [1, nx, nx * ny];      // point index strides
    const cStride = [1, cx, cx * cy];      // cell index strides
    const cellVert = new Int32Array(cx * cy * cz).fill(-1);
    const pos = [], nrm = [], col = [];
    const P = g.paint;
    const v = new Float32Array(8);
    // Field gradient at a grid point (central differences) = outward normal.
    const gx = (i, j, k) => f[Math.min(i + 1, nx - 1) + nx * (j + ny * k)] - f[Math.max(i - 1, 0) + nx * (j + ny * k)];
    const gy = (i, j, k) => f[i + nx * (Math.min(j + 1, ny - 1) + ny * k)] - f[i + nx * (Math.max(j - 1, 0) + ny * k)];
    const gz = (i, j, k) => f[i + nx * (j + ny * Math.min(k + 1, nz - 1))] - f[i + nx * (j + ny * Math.max(k - 1, 0))];

    // Corner offsets and the 12 cube edges (pairs of corner ids).
    const cornerOff = [];
    for (let c = 0; c < 8; c++) cornerOff.push(pStride[0] * (c & 1) + pStride[1] * ((c >> 1) & 1) + pStride[2] * ((c >> 2) & 1));
    const edges = [];
    for (let c = 0; c < 8; c++) for (let bit = 1; bit < 8; bit <<= 1) if (!(c & bit)) edges.push(c, c | bit);

    // Pass 1: place a vertex in every cell that straddles the surface.
    let vcount = 0;
    for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++) {
      const base = i + nx * (j + ny * k);
      let mask = 0;
      for (let c = 0; c < 8; c++) { v[c] = f[base + cornerOff[c]]; if (v[c] < 0) mask |= 1 << c; }
      if (mask === 0 || mask === 255) continue;
      let sx = 0, sy = 0, sz = 0, cnt = 0;
      for (let e = 0; e < 24; e += 2) {
        const a = edges[e], b = edges[e + 1];
        if ((v[a] < 0) === (v[b] < 0)) continue;
        const t = v[a] / (v[a] - v[b]);            // where along the edge f == 0
        sx += (a & 1) + t * ((b & 1) - (a & 1));
        sy += ((a >> 1) & 1) + t * (((b >> 1) & 1) - ((a >> 1) & 1));
        sz += ((a >> 2) & 1) + t * (((b >> 2) & 1) - ((a >> 2) & 1));
        cnt++;
      }
      const fx = sx / cnt, fy = sy / cnt, fz = sz / cnt;
      pos.push(o[0] + (i + fx) * h, o[1] + (j + fy) * h, o[2] + (k + fz) * h);
      // Blend the corner gradients at the vertex position -> smooth shading
      // that follows the true surface rather than the triangle facets.
      let ax = 0, ay = 0, az = 0;
      for (let c = 0; c < 8; c++) {
        const bx = c & 1, by = (c >> 1) & 1, bz = (c >> 2) & 1;
        const w = (bx ? fx : 1 - fx) * (by ? fy : 1 - fy) * (bz ? fz : 1 - fz);
        ax += w * gx(i + bx, j + by, k + bz); ay += w * gy(i + bx, j + by, k + bz); az += w * gz(i + bx, j + by, k + bz);
      }
      const len = Math.hypot(ax, ay, az) || 1;
      nrm.push(ax / len, ay / len, az / len);
      // Paint colour at the vertex: blend the 8 corners, weighted by how much
      // paint each has, so unpainted corners don't darken the colour.
      let pr = 0, pg = 0, pb = 0, pa = 0;
      for (let c = 0; c < 8; c++) {
        const bx = c & 1, by = (c >> 1) & 1, bz = (c >> 2) & 1;
        const q = (base + cornerOff[c]) * 4, a = P[q + 3];
        if (!a) continue;
        const w = (bx ? fx : 1 - fx) * (by ? fy : 1 - fy) * (bz ? fz : 1 - fz) * a;
        pr += w * P[q]; pg += w * P[q + 1]; pb += w * P[q + 2]; pa += w;
      }
      if (pa > 0) col.push(pr / pa, pg / pa, pb / pa, pa);   // pa = weighted coverage (0..255)
      else col.push(0, 0, 0, 0);
      cellVert[i + cx * (j + cy * k)] = vcount++;
    }

    // Pass 2: stitch quads across every sign-changing grid edge.
    const idx = [];
    const p = [0, 0, 0];
    for (p[2] = 0; p[2] < nz; p[2]++) for (p[1] = 0; p[1] < ny; p[1]++) for (p[0] = 0; p[0] < nx; p[0]++) {
      const pi = p[0] + nx * (p[1] + ny * p[2]);
      const f0 = f[pi];
      for (let a = 0; a < 3; a++) {
        const u = (a + 1) % 3, w = (a + 2) % 3;
        if (p[a] >= g.n[a] - 1) continue;
        if (p[u] < 1 || p[u] > g.n[u] - 2 || p[w] < 1 || p[w] > g.n[w] - 2) continue;
        const inside0 = f0 < 0, inside1 = f[pi + pStride[a]] < 0;
        if (inside0 === inside1) continue;
        const cb = p[0] + cx * (p[1] + cy * p[2]);
        const c00 = cellVert[cb - cStride[u] - cStride[w]];
        const c10 = cellVert[cb - cStride[w]];
        const c11 = cellVert[cb];
        const c01 = cellVert[cb - cStride[u]];
        if (inside0) idx.push(c00, c10, c11, c00, c11, c01);   // normal points toward +a
        else         idx.push(c00, c11, c10, c00, c01, c11);   // normal points toward -a
      }
    }
    return { positions: new Float32Array(pos), normals: new Float32Array(nrm),
             colors: Uint8Array.from(col, Math.round), indices: new Uint32Array(idx) };
  }
}
// ENGINE END

const clayMaterial = new THREE.MeshStandardMaterial({ color: 0xd9c7a7, roughness: 0.85, metalness: 0 });

// ---------------------------------------------------------------------------
// Stone surface: a photo of real stone (embedded at the bottom of this file).
// The mesh is rebuilt constantly and has no UV coordinates, so the photo is
// applied with *triplanar mapping*: it's projected along X, Y and Z in world
// space and blended by which way the surface faces. Nothing ever stretches,
// and freshly carved surfaces pick up stone that matches their surroundings.
// The photo's light/dark detail doubles as a bump map, so cracks and chips
// catch the light. Paint arrives as a per-vertex colour laid over the stone.
// ---------------------------------------------------------------------------
const STONE_TILE = 1.2;     // world units covered by one repeat of the photo
const STONE_BUMP = 0.6;     // how strongly the photo's detail affects lighting (0 = flat)

const stoneUniforms = {
  uStone: { value: new THREE.DataTexture(new Uint8Array([150, 140, 120, 255]), 1, 1) },
  uTile:  { value: STONE_TILE },
  uBump:  { value: STONE_BUMP },
};
stoneUniforms.uStone.value.needsUpdate = true;          // grey placeholder until the photo decodes
new THREE.TextureLoader().load(window.STONE_TEXTURE, tex => {
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  stoneUniforms.uStone.value = tex;
});

const STONE_GLSL = /* glsl */`
uniform sampler2D uStone; uniform float uTile; uniform float uBump;
varying vec3 vWPos; varying vec3 vWNrm; varying vec4 vPaint; varying mat3 vNMat;
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }   // sRGB-ish colour -> linear

// Each projection gets its own offset so the three views don't line up
// and make the repeat obvious at the block's edges.
vec3 stoneColor(vec3 p, vec3 n) {
  vec3 w = pow(abs(n), vec3(4.0)); w /= (w.x + w.y + w.z);
  vec3 q = p / uTile;
  return texture2D(uStone, q.zy + vec2(0.31, 0.17)).rgb * w.x
       + texture2D(uStone, q.xz + vec2(0.63, 0.41)).rgb * w.y
       + texture2D(uStone, q.xy).rgb * w.z;
}
float stoneHeight(vec3 p, vec3 n) { return dot(stoneColor(p, n), vec3(0.299, 0.587, 0.114)); }
`;
clayMaterial.roughness = 0.92;
clayMaterial.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, stoneUniforms);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec4 paint;\nvarying vec3 vWPos; varying vec3 vWNrm; varying vec4 vPaint; varying mat3 vNMat;')
    // Object-space coordinates: a broken-off piece keeps exactly the stone
    // pattern it had on the block while it tumbles.
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vWPos = transformed;
      vWNrm = normalize(objectNormal);
      vNMat = normalMatrix;
      vPaint = paint;`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\n' + STONE_GLSL)
    .replace('#include <map_fragment>', `#include <map_fragment>
      diffuseColor.rgb = mix(stoneColor(vWPos, normalize(vWNrm)), lin(vPaint.rgb), vPaint.a);`)
    // Bump: tilt the lighting normal along the slope of the photo's brightness.
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      if (uBump > 0.0) {
        vec3 wn = normalize(vWNrm);
        float e = uTile / 700.0;                         // ~1.5 texels
        float h0 = stoneHeight(vWPos, wn);
        vec3 g = vec3(stoneHeight(vWPos + vec3(e,0,0), wn) - h0,
                      stoneHeight(vWPos + vec3(0,e,0), wn) - h0,
                      stoneHeight(vWPos + vec3(0,0,e), wn) - h0) / e;
        g -= dot(g, wn) * wn;
        normal = normalize(normal - uBump * 0.012 * (vNMat * g));
      }`);
};
const clay = new THREE.Mesh(new THREE.BufferGeometry(), clayMaterial);
scene.add(clay);

// Upright block: 1.2 wide (x), 2 tall (y), 1 deep (z).
const BLOCK = [1.2, 2, 1];
const volume = new SculptVolume({ size: BLOCK, cell: 0.025 });

function rebuildMesh() {
  const { positions, normals, colors, indices } = volume.mesh();
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geo.setAttribute('paint', new THREE.BufferAttribute(colors, 4, true));   // bytes -> 0..1 in shader
  geo.setIndex(new THREE.BufferAttribute(indices, 1));
  geo.computeBoundingBox();
  geo.computeBoundingSphere();
  clay.geometry.dispose();
  clay.geometry = geo;
}
rebuildMesh();

  return volume.hammer(c.toArray(), src.u.toArray(), src.v.toArray(), src.n.toArray(), hu, hv, ham.depth, ham.seed, apply);
}
function hammerStrike() {

  if (piece) {
    // Away from the block's centre line (so blocks off the top don't land back in their hole),
    // plus a hop upward and a push out of the face.
    const away = new V3(c.x, 0, c.z);
    if (away.lengthSq() < 1e-4) away.set(Math.random() - 0.5, 0, Math.random() - 0.5);
    away.normalize();
    const launch = ham.n.clone().multiplyScalar(1.0 + 1.2 * tool.strength)
      .addScaledVector(away, 0.8 + 0.6 * tool.strength)
      .add(new V3(0, 1.2, 0))
      .add(new V3().randomDirection().multiplyScalar(0.2));
    spawnPiece(piece, launch, new V3().randomDirection().multiplyScalar(1.5 + 1.5 * Math.random()),
               { dir: ham.n, dist: ham.depth + 0.08, speed: 1.5 + 1.5 * tool.strength });
  }
  spawnDust(c, ham.n, ham.u, 50 + Math.round(40 * tool.strength));
  dropFloating();
  rebuildMesh();

// A mallet: the head's striking face points at the stone, handle off to the side.
const hammerModel = new THREE.Group();
{
  const iron = new THREE.MeshStandardMaterial({ color: 0x5d6168, metalness: 0.7, roughness: 0.45 });
  const wood = new THREE.MeshStandardMaterial({ color: 0x8a5a33, roughness: 0.7 });
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.2, 0.09), iron);
  head.position.y = 0.1;                                   // face at local y = 0
  const handleGeo = new THREE.CylinderGeometry(0.018, 0.022, 0.5, 12);
  handleGeo.rotateX(Math.PI / 2); handleGeo.translate(0, 0.1, 0.29);
  hammerModel.add(head, new THREE.Mesh(handleGeo, wood));
}
hammerModel.visible = false;
scene.add(hammerModel);
function placeHammer(c, n, u, v) {
  const swing = Math.sin(hamKick * Math.PI);
  hammerModel.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(u, n, v.clone().negate()));
  hammerModel.position.copy(c).addScaledVector(n, 0.3 - 0.28 * swing);

// Every frame while the hammer tool is active.
const hoverRect = { tip: new V3(), n: new V3(), u: new V3(), v: new V3(), a0: 0, a1: 0, b0: 0, b1: 0 };
function updateHammer(dt) {
  cursor.visible = false;
  hamKick = Math.max(0, hamKick - dt * 4);
  let src = null;
  if (ham.dragging || ham.active) {
    if (pointerDirty && ham.dragging) { pointerDirty = false; hammerDragFromPointer(); }
    src = ham;
  } else {
    if (pointerDirty) {
      pointerDirty = false;
      const hit = pick();
      hamHover.ok = !!hit;
      if (hit) { hamHover.tip.copy(hit.point); hamHover.n.copy(hitNormal(hit)); }
    }
    if (hamHover.ok) { hoverRect.tip.copy(hamHover.tip); hammerFrame(hamHover.n, hoverRect); src = hoverRect; }
  }
  hammerModel.visible = !!src || hamKick > 0;
  if (!src) { if (hamKick <= 0) previewGroup.visible = false; return; }
  const { c } = hammerRect(src);
  placeHammer(c, src.n, src.u, src.v);
  // Preview (throttled; only rebuilt when the rectangle actually changes).
  const r = hammerRect(src);
  const key = ['H', r.c.toArray().map(x => x.toFixed(3)), r.hu.toFixed(3), r.hv.toFixed(3), src.u.toArray().map(x => x.toFixed(2)),
               ham.depth, ham.size, ham.seed].join('|');
  if (key === previewKey) return;
  const now = performance.now();
  if (now - previewAt < 70) return;
  previewKey = key; previewAt = now;
  const piece = hammerPiece(src, false);
  showPreview(piece, !!piece);
  const hits = !!piece;
  if (src === ham && hits !== ham.hitsStone) { ham.hitsStone = hits; updateStatus(); }
}

// ---------------------------------------------------------------------------
// Instruction bar: always says what to do next (and is read out by screen

const statusText = document.getElementById('statusText');
const aimButtons = document.getElementById('aimButtons');

function announce(msg) { announcement = msg; announceUntil = performance.now() + 2500; updateStatus(); }
function updateStatus() {
  let html;
  if (cameraMode()) html = 'Camera mode: drag to turn the view, scroll to zoom. Press <b>V</b> (or let go of Space) to sculpt again.';
  else if (tool.mode === 'chisel' && aim.active) {
    html = aim.hitsStone
      ? `Next chip: <b>${SHAPE_NAMES[aim.shape]}</b>. Point where it should break off, then click to strike. Q/E turn · R/F steeper/shallower`
      : 'The chisel would only hit air here. Point back at the stone, or press Esc to cancel.';
  } else if (tool.mode === 'hammer' && ham.dragging) {
    html = 'Drag to size the block, then let go.';
  } else if (tool.mode === 'hammer' && ham.active) {
    html = ham.hitsStone
      ? 'Click or press Enter to swing the hammer. R/F shallower/deeper · Q/E turn · Esc cancel'
      : 'That rectangle is only over air. Press Esc and try again on the stone.';
  } else {
    html = {
      hammer: 'Click the stone to knock off a block, or drag a rectangle to size it. The outline shows what will break off.',
      smooth: 'Drag over rough spots to sand them smooth.',
      paint: 'Drag on the stone to paint. Press E for the eraser.',
      chisel: 'Click the stone to place the chisel. (Shortcut: press, drag toward the chip, release.)',
    }[tool.mode];
    if (performance.now() < announceUntil) html = `${announcement} ${html}`;
  }
  if (statusText.innerHTML !== html) statusText.innerHTML = html;
  const chiselReady = tool.mode === 'chisel' && aim.active, hammerReady = tool.mode === 'hammer' && ham.active;
  aimButtons.hidden = !((chiselReady || hammerReady) && !cameraMode());
  document.getElementById('btnReroll').hidden = !chiselReady || chiselState.shapeChoice !== 'random';
  document.getElementById('btnStrike').textContent = hammerReady ? 'Swing (Enter)' : 'Strike (Enter)';
}
document.getElementById('btnStrike').onclick = () => (tool.mode === 'hammer' ? hammerStrike() : strikeNow());
document.getElementById('btnCancelAim').onclick = () => (tool.mode === 'hammer' ? cancelHammer() : cancelAim());

// ---------------------------------------------------------------------------
// Debris: broken-off pieces with simple rigid-body motion (gravity, spin,
// bouncing on the floor, and being pushed out of the block if they hit it).
// ---------------------------------------------------------------------------
const FLOOR_Y = -BLOCK[1] / 2, GRAVITY = 6, MAX_DEBRIS = 60;
const debris = [];
const _q = new THREE.Quaternion(), _v = new V3(), _w = new V3();

// eject (optional): { dir, dist, speed } - slide the piece straight out of its
// hole before normal physics starts, so it can't snag on the walls it broke from.
function spawnPiece(piece, vel, spin, eject = null) {
  if (piece.count < 4) return false;                   // too small to see: dust only
  const m = SculptVolume.meshGrid(piece);
  if (!m.indices.length) return false;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(m.positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(m.normals, 3));
  geo.setAttribute('paint', new THREE.BufferAttribute(m.colors, 4, true));
  geo.setIndex(new THREE.BufferAttribute(m.indices, 1));
  // Pivot at the centroid: the group moves/rotates, the mesh inside is offset
  // back so its vertices keep their original (block) coordinates for texturing.
  const c = new V3(), P = m.positions, nv = P.length / 3;
  for (let i = 0; i < P.length; i += 3) c.x += P[i], c.y += P[i + 1], c.z += P[i + 2];
  c.divideScalar(nv);
  const local = new Float32Array(P.length);                 // vertex offsets from the pivot
  for (let i = 0; i < P.length; i += 3) { local[i] = P[i] - c.x; local[i + 1] = P[i + 1] - c.y; local[i + 2] = P[i + 2] - c.z; }
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, clayMaterial);
  mesh.position.copy(c).negate();
  const group = new THREE.Group();
  group.position.copy(c);
  group.add(mesh);
  scene.add(group);
  // A spread of vertices used as contact points (keeps big pieces cheap).
  const stride = Math.max(1, Math.floor(nv / 160)), probes = [];
  for (let i = 0; i < nv; i += stride) probes.push(local[3 * i], local[3 * i + 1], local[3 * i + 2]);
  debris.push({ group, mesh, vel, spin, probes, step: actionId, resting: false, age: 0, restFrames: 0,
                eject: eject && { dir: eject.dir.clone().normalize(), left: eject.dist, speed: eject.speed } });
  while (debris.length > MAX_DEBRIS) removeDebris(d => d === debris[0]);
  return true;
}
function removeDebris(match) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    if (!match(d)) continue;
    scene.remove(d.group);
    d.mesh.geometry.dispose();
    debris.splice(i, 1);
  }
}
function clearDebris() { removeDebris(() => true); }
document.getElementById('btnClearDebris').onclick = clearDebris;

// Cut loose anything no longer attached to the base and let it fall.
function dropFloating() {
  const pieces = volume.detachFloating();
  for (const piece of pieces) {
    const drift = new V3((Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3);
    const spin = new V3((Math.random() - 0.5) * 1.5, 0, (Math.random() - 0.5) * 1.5);
    if (!spawnPiece(piece, drift, spin)) {
      const o = piece.origin, h = piece.h, n = piece.n;
      spawnDust(new V3(o[0] + n[0] * h / 2, o[1] + n[1] * h / 2, o[2] + n[2] * h / 2), new V3(0, 1, 0), new V3(1, 0, 0), 10);
    }
  }
  return pieces.length > 0;
}

const DEBRIS_LIFETIME = 5, SHRINK_TIME = 0.6;   // seconds; pieces shrink away at the end
const UP = new V3(0, 1, 0), SIDE = new V3(1, 0, 0);
function updateDebris(dt) {
  for (let idx = debris.length - 1; idx >= 0; idx--) {
    const d = debris[idx];
    d.age += dt;
    // After 5 seconds the piece shrinks away with a little puff of dust.
    if (d.age > DEBRIS_LIFETIME - SHRINK_TIME) {
      const k = Math.max(0, (DEBRIS_LIFETIME - d.age) / SHRINK_TIME);
      d.group.scale.setScalar(Math.max(1e-4, k * k * (3 - 2 * k)));
      if (d.age >= DEBRIS_LIFETIME) {
        spawnDust(d.group.position, UP, SIDE, 12);
        removeDebris(x => x === d);
        continue;
      }
    }
    if (d.resting) continue;

    // 1) Ejection: slide straight out of the hole - no gravity, no collisions.
    if (d.eject) {
      const step = Math.min(d.eject.left, d.eject.speed * dt);
      d.group.position.addScaledVector(d.eject.dir, step);
      d.eject.left -= step;
      if (d.eject.left <= 0) d.eject = null;       // clear of the stone: normal physics from here
      continue;
    }

    // 2) Normal flight: gravity + spin.
    d.vel.y -= GRAVITY * dt;
    d.group.position.addScaledVector(d.vel, dt);
    const w = d.spin.length();
    if (w > 1e-4) { _q.setFromAxisAngle(_w.copy(d.spin).divideScalar(w), w * dt); d.group.quaternion.premultiply(_q); }

    // Contacts: lowest probe vs the floor, deepest probe vs the stone block.
    let low = Infinity, pen = 0, penAt = null;
    const pr = d.probes;
    for (let i = 0; i < pr.length; i += 3) {
      _v.set(pr[i], pr[i + 1], pr[i + 2]).multiplyScalar(d.group.scale.x).applyQuaternion(d.group.quaternion).add(d.group.position);
      if (_v.y < low) low = _v.y;
      const f = volume.sample(_v.x, _v.y, _v.z);
      if (f < -pen) { pen = -f; penAt = _v.clone(); }
    }
    // Ignore hair-thin overlaps (surfaces that merely touch) - they caused jitter.
    if (penAt && pen > 0.3 * volume.h) {           // pushed back out of the block
      const g = volume.gradient(penAt.x, penAt.y, penAt.z);
      const n = _w.set(g[0], g[1], g[2]);
      d.group.position.addScaledVector(n, pen);
      const vn = d.vel.dot(n);
      if (vn < 0) d.vel.addScaledVector(n, -1.3 * vn);
      d.vel.multiplyScalar(0.85);
      d.spin.multiplyScalar(0.85);
      // Sitting still on the stone: let it settle instead of buzzing in place.
      if (d.vel.lengthSq() < 0.05) { if (++d.restFrames > 15) d.resting = true; } else d.restFrames = 0;
    }
    if (low < FLOOR_Y) {                           // bounce, then scrape to a stop
      d.group.position.y += FLOOR_Y - low;
      if (d.vel.y < 0) d.vel.y *= -0.3;
      d.vel.x *= 0.6; d.vel.z *= 0.6;
      d.spin.multiplyScalar(0.6);
      if (d.vel.lengthSq() < 0.01 && d.spin.lengthSq() < 0.05) d.resting = true;
    }
  }
}

// Stone dust: a quick puff of particles at the point of impact.
const dustBursts = [];
const dustMat = new THREE.PointsMaterial({ color: 0xc9bfa9, size: 0.018, transparent: true, depthWrite: false });
function spawnDust(p, n, t, count) {
  const pos = new Float32Array(count * 3), vel = [];
  for (let i = 0; i < count; i++) {
    pos[3 * i] = p.x; pos[3 * i + 1] = p.y; pos[3 * i + 2] = p.z;
    vel.push(n.clone().multiplyScalar(0.4 + Math.random()).addScaledVector(t, Math.random() * 0.6)
      .add(new V3().randomDirection().multiplyScalar(0.5)));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, dustMat.clone());
  scene.add(pts);
  dustBursts.push({ pts, vel, age: 0 });
}
function updateDust(dt) {
  for (let b = dustBursts.length - 1; b >= 0; b--) {
    const d = dustBursts[b];
    d.age += dt;
    const P = d.pts.geometry.attributes.position;
    for (let i = 0; i < d.vel.length; i++) {
      d.vel[i].y -= 3 * dt;
      d.vel[i].multiplyScalar(1 - 1.5 * dt);          // air drag
      P.array[3 * i] += d.vel[i].x * dt; P.array[3 * i + 1] = Math.max(FLOOR_Y, P.array[3 * i + 1] + d.vel[i].y * dt); P.array[3 * i + 2] += d.vel[i].z * dt;
    }
    P.needsUpdate = true;
    d.pts.material.opacity = Math.max(0, 1 - d.age / 1.2);
    if (d.age > 1.2) { scene.remove(d.pts); d.pts.geometry.dispose(); d.pts.material.dispose(); dustBursts.splice(b, 1); }
  }
}

// Called every frame while the chisel tool is active.
function updateChisel(dt) {
  cursor.visible = false;
  kick = Math.max(0, kick - dt * 5);
  if (aim.active) {
    if (pointerDirty) { pointerDirty = false; aimFromPointer(); }
    placeChisel(aim.tip, aim.n, aim.t);
    chiselModel.visible = true;
    refreshPreview();
    return;
  }
  if (pointerDirty) {
    pointerDirty = false;
    const hit = pick();
    hover.ok = !!hit;
    if (hit) { hover.tip.copy(hit.point); hover.n.copy(hitNormal(hit)); }
  }
  chiselModel.visible = hover.ok;
  if (hover.ok) {
    const reuse = lastAimDir && lastAimDir.clone().addScaledVector(hover.n, -lastAimDir.dot(hover.n));
    placeChisel(hover.tip, hover.n, reuse && reuse.length() > 0.5 ? reuse.normalize() : defaultHeading(hover.tip, hover.n));
  }
}

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.minDistance = 1.2;
controls.maxDistance = 12;
// Right-drag orbits (works even when the block fills the screen),
// middle-drag pans, Shift/Ctrl + any drag pans, wheel zooms.
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };

// --- Camera mode (toggle with V / button, or hold Space) ---------------------
let camToggle = false, spaceHeld = false;
const camBtn = document.getElementById('btnCamMode');
function cameraMode() { return camToggle || spaceHeld; }
function refreshCamUI() {
  camBtn.classList.toggle('active', cameraMode());
  canvas.classList.toggle('orbiting', cameraMode());
  if (cameraMode()) cursor.visible = false;
  updateStatus();
}
camBtn.onclick = () => { camToggle = !camToggle; refreshCamUI(); };

// --- Preset views with a smooth fly-to ---------------------------------------
const VIEWS = {
  home:  new THREE.Vector3(3.2, 1.6, 4.0),
  front: new THREE.Vector3(0, 0, 5),
  side:  new THREE.Vector3(5, 0, 0),
  top:   new THREE.Vector3(0, 5, 0.001),   // tiny z offset avoids a gimbal flip
};
let flight = null;   // { fromPos, toPos, fromTarget, t }
function flyTo(name) {
  flight = { fromPos: camera.position.clone(), toPos: VIEWS[name].clone(),
             fromTarget: controls.target.clone(), t: 0 };
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => flyTo(b.dataset.view));
function updateFlight(dt) {
  if (!flight) return;
  flight.t = Math.min(1, flight.t + dt / 0.6);           // 0.6 s flight
  const k = flight.t * flight.t * (3 - 2 * flight.t);    // smoothstep ease
  camera.position.lerpVectors(flight.fromPos, flight.toPos, k);
  controls.target.lerpVectors(flight.fromTarget, new THREE.Vector3(0, 0, 0), k);
  if (flight.t === 1) flight = null;
}

// --- Keyboard orbit (arrow keys) -----------------------------------------------
const held = new Set();
const spherical = new THREE.Spherical();
function keyboardOrbit(dt) {
  const speed = 1.8 * dt;                                // radians per second
  let dTheta = 0, dPhi = 0;
  if (held.has('ArrowLeft'))  dTheta -= speed;
  if (held.has('ArrowRight')) dTheta += speed;
  if (held.has('ArrowUp'))    dPhi -= speed;
  if (held.has('ArrowDown'))  dPhi += speed;
  if (!dTheta && !dPhi) return;
  flight = null;
  const offset = camera.position.clone().sub(controls.target);
  spherical.setFromVector3(offset);
  spherical.theta += dTheta;
  spherical.phi = Math.min(Math.PI - 0.05, Math.max(0.05, spherical.phi + dPhi));
  camera.position.copy(controls.target).add(offset.setFromSpherical(spherical));
}

addEventListener('keydown', e => {
  if (e.target instanceof HTMLSelectElement || (e.target instanceof HTMLInputElement && e.target.type !== 'range')) return;
  if (e.code === 'Space') { e.preventDefault(); if (!spaceHeld) { spaceHeld = true; refreshCamUI(); } return; }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); held.add(e.key); return; }
  const views = { '1': 'front', '2': 'side', '3': 'top', '0': 'home' };
  if (views[e.key]) { flyTo(views[e.key]); return; }
  if (e.key === 'v') { camToggle = !camToggle; refreshCamUI(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'h') setMode('hammer');
  else if (e.key === 's') setMode('smooth');
  else if (e.key === 'p') setMode('paint');
  else if (e.key === 'x') setMode('chisel');
  else if (e.key === 'Escape') { cancelAim(); cancelHammer(); }
  else if (tool.mode === 'hammer' && e.key === 'Enter' && ham.active) { e.preventDefault(); hammerStrike(); }
  else if (tool.mode === 'hammer' && e.key === 'q') turnHammer(15);
  else if (tool.mode === 'hammer' && e.key === 'e') turnHammer(-15);
  else if (tool.mode === 'hammer' && e.key === 'r') setHammerDepth(ham.depth - 0.05);
  else if (tool.mode === 'hammer' && e.key === 'f') setHammerDepth(ham.depth + 0.05);
  else if (tool.mode === 'chisel' && e.key === 'Enter' && aim.active) { e.preventDefault(); strikeNow(); }
  else if (tool.mode === 'chisel' && e.key === 'q') turnAim(15);
  else if (tool.mode === 'chisel' && e.key === 'e') turnAim(-15);
  else if (tool.mode === 'chisel' && e.key === 'r') setChiselAngle(parseFloat(ui.chiselAngle.value) - 5);
  else if (tool.mode === 'chisel' && e.key === 'f') setChiselAngle(parseFloat(ui.chiselAngle.value) + 5);
  else if (e.key === 'e' && tool.mode === 'paint') setErase(!paintState.erase);
  else if (e.key === '[') setRadius(tool.radius - 0.01);
  else if (e.key === ']') setRadius(tool.radius + 0.01);
});
addEventListener('keyup', e => {
  if (e.code === 'Space') { e.preventDefault(); spaceHeld = false; refreshCamUI(); }
  held.delete(e.key);
});
addEventListener('blur', () => { held.clear(); spaceHeld = false; refreshCamUI(); });
// Keep Space/Enter from re-clicking whichever UI button was last pressed.
document.querySelectorAll('#ui button').forEach(b => b.addEventListener('click', () => b.blur()));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- Main loop: at most one pick/dab per frame keeps it responsive ----------
setMode('chisel');   // default tool
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  keyboardOrbit(dt);
  updateFlight(dt);
  updateDebris(dt);
  updateDust(dt);
  if (announceUntil && performance.now() > announceUntil) { announceUntil = 0; updateStatus(); }
  if (tool.mode === 'chisel') {
    if (cameraMode()) chiselModel.visible = false; else updateChisel(dt);
  } else if (tool.mode === 'hammer') {
    if (cameraMode()) hammerModel.visible = false; else updateHammer(dt);
  } else if ((pointerDirty || sculpting) && !cameraMode()) {
    pointerDirty = false;
    const hit = pick();
    if (sculpting) {
      // Brush eases toward the point under the mouse; harder material = more drag.
      if (hit) brushPos.lerp(hit.point, 1 - Math.exp(-followRate() * dt));
      strokeTo(brushPos);
      cursor.visible = true;
      cursor.position.copy(brushPos);
    } else if (hit) {
      cursor.visible = true;
      cursor.position.copy(hit.point);
    } else {
      cursor.visible = false;
    }
    cursor.scale.setScalar(tool.radius);
  }
  if (meshDirty) { meshDirty = false; rebuildMesh(); }   // one remesh per frame, however many dabs
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

<!-- Stone texture: a seamless 1024x1024 JPEG, embedded so the page works when
