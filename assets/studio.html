<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pygmalion's Unexceptionable 100% Authentic Sculpting Experience</title>
<style>
  @font-face { font-family: 'Pixelify Sans'; src: url('./assets/fonts/PixelifySans-VariableFont_wght.ttf') format('truetype'); font-style: normal; font-weight: 400 700; font-display: swap; }
  :root { --bg: #171916; --panel: #20221e; --line: #41443b; --text: #efeee8; --muted: #a8aa9f;
          --accent: #d2aa58; --focus: #e4c276; --rail: #c4cec2; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(145deg, #20221d, #151714 58%);
               font-family: 'Pixelify Sans', 'Segoe UI', sans-serif; color: var(--text); }
  canvas { display: block; touch-action: none; }
  button, input, select, textarea { font-family: inherit; }
  [hidden] { display: none !important; }
  #ui { position: absolute; top: 12px; left: 92px; width: 258px; padding: 12px 14px;
        max-height: calc(100vh - 48px); overflow-y: auto; box-sizing: border-box;
        background: rgba(25,27,23,.9); border: 1px solid rgba(196, 190, 158, .2); border-radius: 8px;
        box-shadow: 0 12px 38px rgba(0,0,0,.28); backdrop-filter: blur(14px); font-size: 13px;
        line-height: 1.55; user-select: none; }
  #ui label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #ui input[type=range] { width: 115px; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  button { flex: 1; background: #2b2e28; color: var(--text); border: 1px solid #494c42;
           border-radius: 5px; padding: 6px; cursor: pointer; font-size: 12px;
           transition: background-color .15s ease, border-color .15s ease, transform .15s ease; }
  button:hover { background: #393c33; border-color: #696b5d; }
  button.active { background: #52634f; border-color: #8fa182; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; opacity: .55;
           margin: -4px 0 4px 105px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
  .tools .wide { grid-column: span 2; }
  /* Vertical tool strip: light blue, icons carry a 1-pixel black outline so they pop. */
  #toolbar { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 4px;
             padding: 6px; background: var(--rail); border: 1px solid rgba(255,255,255,.34); border-radius: 8px;
             box-shadow: 0 10px 28px rgba(0,0,0,.26); }
  #toolbar button { width: 58px; height: 58px; flex: none; padding: 0; display: grid; place-items: center;
                    background: transparent; border: 2px solid transparent; border-radius: 8px; }
  #toolbar button:hover { background: #b3c1af; }
  #toolbar button.active { background: #a0b29d; border-color: #52634f; }
  #toolbar button:focus-visible { outline-color: #52634f; }
  .chisel-icon { width: 48px; height: 48px; image-rendering: pixelated; display: block; }
  /* Generated icons show at their true pixel size (1 art pixel = 1 screen pixel) so they stay crisp. */
  .tool-icon { width: auto; height: auto; max-width: 54px; max-height: 54px; image-rendering: pixelated; display: block; }
  .tb-sep { height: 1px; margin: 3px 6px; background: #9da995; border-radius: 1px; }
  .swatches { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
  .swatches span { width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
                   border: 2px solid transparent; box-sizing: border-box; }
  .swatches span.active { border-color: #fff; }
  #paintColor { width: 30px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; }
  select { width: 125px; background: #252821; color: var(--text); border: 1px solid #494c42;
           border-radius: 5px; padding: 5px; font-size: 12px; }
  #status { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
            max-width: min(760px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 10px;
            background: rgba(25,27,23,.92); border: 1px solid rgba(196, 190, 158, .2);
            box-shadow: 0 8px 28px rgba(0,0,0,.26); backdrop-filter: blur(12px);
            font-size: 14px; line-height: 1.45; text-align: center;
            display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: center; }
  #status button { flex: none; font-size: 13px; padding: 6px 10px; }
  #status button.primary { background: var(--accent); border-color: var(--accent); color: #1d1f24; font-weight: 600; }
  #status b { color: var(--focus); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .head { display: flex; flex-direction: column; gap: 4px; }
  .head .brand { font-size: 15px; line-height: 1.35; }
  .head .links { display: flex; gap: 12px; }
  #generalContent { padding-right: 32px; }
  #btnToggleControls { position: absolute; top: 0; right: 0; z-index: 2; width: 26px; height: 26px; padding: 0;
                       display: grid; place-items: center; flex: none; border-color: rgba(196, 190, 158, .3); }
  button.link { background: none; border: none; padding: 0; flex: none; color: #c3d0c5; font-size: 12px; cursor: pointer; }
  button.link:hover { background: none; text-decoration: underline; }
  a.link { color: #c3d0c5; font-size: 12px; text-decoration: none; }
  a.link:hover { text-decoration: underline; }
  button.primary, a.button.primary { background: var(--accent); border-color: var(--accent); color: #1d1f24; font-weight: 600; }
  button.primary:hover { background: #e0b962; }
  button:disabled { opacity: .6; cursor: default; }
  .note { font-size: 12px; opacity: .75; margin: 4px 0; }
  .error { color: #ff8a7a; font-size: 13px; min-height: 1em; margin: 4px 0; }
  a.button { display: inline-block; text-align: center; text-decoration: none; border-radius: 5px; padding: 7px 10px;
             font-size: 12px; border: 1px solid #494c42; flex: 1; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px;
           width: min(360px, calc(100vw - 32px)); font-family: 'Pixelify Sans', 'Segoe UI', sans-serif;
           box-shadow: 0 24px 70px rgba(0,0,0,.46); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 10px; font-size: 18px; }
  #pubThumb { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #15171a; display: block; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; margin: 8px 0; }
  .field input { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 5px; border: 1px solid #494c42;
                 background: #252821; color: var(--text); }
  /* Tutorial: parchment speech bubble + framed pixel portrait, top right. */
  #tutorial { position: absolute; top: 14px; right: 14px; display: flex; align-items: flex-start; gap: 10px;
              max-width: min(470px, calc(100vw - 360px)); min-width: 280px; z-index: 5; }
  /* 128px = exactly 4x the 32px art, so every pixel stays square and sharp. */
  #tutFace { width: 128px; height: 128px; flex: none; image-rendering: pixelated; }
  #tutorial .bubble { position: relative; flex: 1; background: #f6eedb; color: #2b2418; border: 2px solid #b99b62;
                      border-radius: 14px; padding: 14px 16px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.45);
                      font-family: 'Pixelify Sans', 'Segoe UI', sans-serif; }
  /* The tail points left, at Pygmalion. */
  #tutorial .bubble { margin-top: 18px; }
  #tutorial .bubble::after, #tutorial .bubble::before { content: ''; position: absolute; top: 34px; border-style: solid; }
  #tutorial .bubble::before { left: -14px; border-width: 10px 14px 10px 0; border-color: transparent #b99b62 transparent transparent; }
  #tutorial .bubble::after  { left: -10px; border-width: 8px 11px 8px 0;  border-color: transparent #f6eedb transparent transparent; margin-top: 2px; }
  #tutText { margin: 0 0 10px; font-size: 16px; line-height: 1.45; }
  #tutText.cheer { font-size: 26px; font-weight: bold; text-align: center; letter-spacing: .5px; }
  .tut-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 6px;
             font-family: 'Pixelify Sans', 'Segoe UI', sans-serif; }
  .tut-nav #tutCount { grid-column: 1 / -1; min-width: 0; flex: none; color: #7a6a4c; font-family: 'Pixelify Sans', 'Segoe UI', sans-serif; font-size: 12px;
                       text-align: center; white-space: nowrap; }
  .tut-nav button { flex: none; min-width: 0; white-space: nowrap; font-size: 12px; padding: 5px 6px;
                    background: #e8dcc0; color: #2b2418; border-color: #c9b58a; }
  .tut-nav button:hover { background: #dfd0ad; }
  .tut-nav button.primary { background: #8a5a2b; border-color: #8a5a2b; color: #fff8e8; }
  .tut-nav button.primary:hover { background: #9d6a37; }
  .tut-nav .tut-voice { background: none; border-color: transparent; padding: 3px 5px; font-size: 15px; }
  .tut-nav .tut-voice[aria-pressed="false"] { opacity: .55; }
  .tut-nav .tut-skip { background: none; border-color: transparent; color: #7a6a4c; text-decoration: underline; }
  /* Pulsing ring around whatever the current step asks you to use. */
  .tut-highlight { position: relative; z-index: 1; animation: tutPulse 1.2s ease-in-out infinite; }
  @keyframes tutPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 204, 85, .9); } 50% { box-shadow: 0 0 0 5px rgba(255, 204, 85, .25); } }
  @media (prefers-reduced-motion: reduce) { .tut-highlight { animation: none; box-shadow: 0 0 0 3px #ffcc55; } }
  @media (max-width: 700px) {
    #ui { left: 76px; right: 10px; top: auto; bottom: 100px; width: auto; max-height: min(40dvh, 340px); padding: 10px; }
    #generalContent .head .links { flex-wrap: wrap; }
    #toolbar { left: 10px; top: 10px; padding: 4px; gap: 3px; }
    #toolbar button { width: 52px; height: 52px; }
    .chisel-icon { width: 44px; height: 44px; }
    .tool-icon { max-width: 48px; max-height: 48px; }
    #tutorial { left: 82px; right: 10px; top: 10px; bottom: auto; max-width: none; min-width: 0; gap: 8px; }
    #tutFace { width: 80px; height: 80px; }
    #tutorial .bubble { margin-top: 8px; padding: 10px 12px; }
    #tutText { font-size: 14px; }
    #status { bottom: 10px; max-width: calc(100vw - 20px); padding: 8px 10px; gap: 6px 8px; }
    .tut-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
    .tut-nav #tutCount { grid-column: 1 / -1; min-width: 0; flex: none; white-space: nowrap; text-align: center; }
    .tut-nav button { min-width: 0; padding: 5px 4px; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  .zoom-row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .zoom-row button { flex: none; width: 34px; font-size: 17px; line-height: 1; padding: 4px 0; }
  .zoom-row input { flex: 1; min-width: 0; }
  .section { margin-top: 10px; font-weight: 600; opacity: .85; }
  canvas.orbiting { cursor: grab; }
  canvas.orbiting:active { cursor: grabbing; }
  .hint { opacity: .65; font-size: 12px; margin-top: 6px; }
  #generalPanel { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 8;
                  width: min(620px, calc(100vw - 320px)); box-sizing: border-box; margin: 0; padding: 12px 16px;
                  background: rgba(25,27,23,.94); border: 1px solid rgba(196, 190, 158, .28); border-radius: 8px;
                  box-shadow: 0 12px 38px rgba(0,0,0,.32); backdrop-filter: blur(14px); }
  #generalContent { padding-right: 34px; }
  #generalPanel .head { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #generalPanel .head .brand { flex: 1 1 260px; font-size: 17px; }
  #generalPanel .head .links { flex: none; align-items: center; gap: 10px; }
  #generalPanel .row { margin: 10px 0 0; }
  #generalPanel .row button { width: 100%; }
  #btnToggleControls { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0;
                       display: grid; place-items: center; flex: none; border-color: rgba(196, 190, 158, .38); }
  #generalPanel.general-collapsed { top: 0; width: 42px; height: 40px; min-height: 0; padding: 5px; overflow: hidden;
                                     border-top: 0; border-radius: 0 0 8px 8px;
                                     display: flex; align-items: center; justify-content: center; }
  #generalPanel.general-collapsed #generalContent { display: none; }
  #generalPanel.general-collapsed #btnToggleControls { position: static; transform: rotate(180deg); }
  #ui { top: 116px; left: auto; right: 12px; width: 300px; max-height: calc(100dvh - 132px); }
  body.general-open #tutorial { top: var(--tutorial-top, 156px); right: auto; left: 92px;
                                width: min(320px, calc(100vw - 420px)); max-width: none; }
  @media (min-width: 701px) and (max-width: 1243px) {
    #generalPanel { left: calc((100vw - 220px) / 2); width: min(620px, calc(100vw - 420px)); }
  }
  @media (max-width: 700px) {
    #generalPanel { top: 8px; left: 82px; right: 10px; transform: none; width: auto;
                    max-height: min(34dvh, 280px); padding: 10px 44px 10px 12px; overflow-y: auto; }
    #generalPanel .head { flex-direction: column; align-items: flex-start; gap: 6px; }
    #generalPanel .head .brand { flex: none; font-size: 16px; }
    #generalPanel .head .links { flex-wrap: wrap; }
    #generalPanel.general-collapsed { top: 0; left: 50%; right: auto; transform: translateX(-50%);
                       width: 42px; height: 40px; max-height: none; padding: 5px; overflow: hidden;
                       border-top: 0; border-radius: 0 0 8px 8px; }
    #generalPanel.general-collapsed #btnToggleControls { position: static; }
    #ui { left: 76px; right: 10px; top: auto; bottom: 100px; width: auto; max-height: min(30dvh, 260px); padding: 8px 10px; }
    #tutorial { left: 82px; right: 10px; top: 58px; bottom: auto; max-width: none; min-width: 0; gap: 8px; }
    body.general-open #tutorial { top: var(--tutorial-top, 160px); left: 82px; right: 10px; width: auto; max-width: none; }
  }
</style>
</head>

  <button data-tool="smooth" title="Sandpaper (S)" aria-label="Sandpaper"><img class="tool-icon" alt=""></button>

</div>
<div id="generalPanel">
  <button type="button" id="btnToggleControls" class="general-toggle" aria-expanded="true" aria-controls="generalContent"
          aria-label="Hide title and gallery options" title="Hide title and gallery options">⌃</button>
  <div id="generalContent">
    <div class="head">
      <b class="brand">Pygmalion's Unexceptionable 100% Authentic Sculpting Experience</b>
      <span class="links"><button type="button" class="link" id="btnTutorial">Tutorial</button>
        <a class="link" href="index.html">Gallery →</a></span>
    </div>
    <div class="row"><button id="btnPublish" class="primary">Publish to gallery</button></div>
  </div>
</div>
<div id="ui">
  <div id="artControls">
  <div id="remixNote" class="note" hidden></div>
  <div class="section" id="toolName" style="margin-top:4px">Chisel</div>
  <label id="sizeRow">Brush size <input id="size" type="range" min="0.05" max="0.4" step="0.01" value="0.12"></label>
  <label>Strength <input id="strength" type="range" min="0.1" max="1" step="0.05" value="0.5"></label>
  <div id="paintPanel" hidden>
    <div class="swatches">
      <input id="paintColor" type="color" value="#c0392b" title="Pick any colour">
      <span data-color="#c0392b"></span><span data-color="#e67e22"></span><span data-color="#f1c40f"></span>
      <span data-color="#27ae60"></span><span data-color="#2980b9"></span><span data-color="#8e44ad"></span>
      <span data-color="#f5f5f0"></span><span data-color="#222222"></span>
    </div>
    <div class="row"><button id="btnErase">Eraser (E)</button></div>
  </div>
  <div id="chiselPanel" hidden>
    <label>Angle (R/F) <input id="chiselAngle" type="range" min="0" max="85" step="1" value="35" aria-label="Chisel angle"></label>
    <div class="scale"><span>Straight in</span><span>Skimming</span></div>
    <label>Chip shape
      <select id="chipShape" aria-label="Chip shape">
        <option value="random">Random</option>
        <option value="wedge">Wedge</option>
        <option value="block">Block</option>
        <option value="shard">Shard</option>
        <option value="flake">Flake</option>
        <option value="splinter">Splinter</option>
      </select>
    </label>
  </div>
  <div id="hammerPanel" hidden>
    <div class="row" id="hammerSizes">
      <button data-hammer="small">Small</button>
      <button data-hammer="medium" class="active">Medium</button>
      <button data-hammer="large">Large</button>
    </div>
    <label>Depth (R/F) <input id="hammerDepth" type="range" min="0.05" max="1.2" step="0.05" value="0.3" aria-label="Hammer cut depth"></label>
    <div class="scale"><span>Shallow</span><span>Deep</span></div>
  </div>
  <div class="row" id="debrisRow"><button id="btnClearDebris">Clear debris</button></div>
  <div class="row">
    <button id="btnUndo">Undo (Ctrl+Z)</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="row"><button id="btnExport">Export STL</button></div>
  <div class="section">Camera</div>
  <div class="row"><button id="btnCamMode">Move camera (V)</button></div>
  <div class="row">
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="top">Top</button>
    <button data-view="home">Reset</button>
  </div>
  <div class="zoom-row">

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { SculptVolume, CHIP_SHAPES, packSculpture, unpackSculpture } from './js/engine.js';
import { storePromise, artistName } from './js/store.js';
import { createStoneMaterial } from './js/stone.js';

// Engine (stone block, tools, meshing, save/load): js/engine.js


// ---------------------------------------------------------------------------
// Rendering + interaction
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;               // the block and chips cast shadows on the floor
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
// Blue-grey like the walls, so no gap in the room ever shows black.
scene.background = new THREE.Color(0x8d9ba3);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
camera.position.set(3.2, 1.6, 4.0);

const hemi = new THREE.HemisphereLight(0xffffff, 0x404050, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 5, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4.5, right: 4.5, top: 4.5, bottom: -4.5, near: 1, far: 20 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);
// Lighting slider: scales every light together (1 = normal).
const LIGHT_BASE = { hemi: hemi.intensity, sun: sun.intensity };
document.getElementById('lightLevel').oninput = e => {
  const k = parseFloat(e.target.value);
  hemi.intensity = LIGHT_BASE.hemi * k;
  sun.intensity = LIGHT_BASE.sun * k;
  ceilingMat.emissiveIntensity = CEILING_GLOW * k;
  for (const m of paintingMats) m.emissiveIntensity = PAINTING_GLOW * k;
};

// ---------------------------------------------------------------------------
// The studio room: plank floor and four walls, from assets/floor.png and
// assets/wall.png (swap those files to change the look). Walls only face
// inward, so whichever wall is between the camera and the stone is invisible
// and never blocks the view.
// ---------------------------------------------------------------------------
// The block stands on a pedestal (1.3 tall), so the floor is below its base.
const PEDESTAL_HEIGHT = 1.3, PEDESTAL_TOP = -1;
const ROOM = { half: 7, height: 9, floorY: PEDESTAL_TOP - PEDESTAL_HEIGHT, floorTile: 2.75, wallTile: 2.75 };
function roomTexture(url, tileSize, w, h) {
  const tex = new THREE.TextureLoader().load(url);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.NearestFilter;            // keep the pixel art crisp up close
  tex.repeat.set(w / tileSize, h / tileSize);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const room = new THREE.Group();
const CEILING_GLOW = 0.7;
const ceilingMat = new THREE.MeshStandardMaterial({ roughness: 1, emissive: 0xffffff, emissiveIntensity: CEILING_GLOW });
{
  const S = ROOM.half * 2;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(S, S),
    new THREE.MeshStandardMaterial({ map: roomTexture('assets/floor.png', ROOM.floorTile, S, S), roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = ROOM.floorY;
  floor.receiveShadow = true;
  room.add(floor);
  // Ceiling: same texture as the walls, facing down into the room.
  // It faces down, away from all the lights, so it also glows a little on
  // its own (scaled by the Lighting slider) instead of going black.
  const ceilTex = roomTexture('assets/wall.png', ROOM.wallTile, S, S);
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(S, S), ceilingMat);
  ceilingMat.map = ceilTex; ceilingMat.emissiveMap = ceilTex;
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = ROOM.floorY + ROOM.height;
  room.add(ceiling);
  const wallMat = new THREE.MeshStandardMaterial({ map: roomTexture('assets/wall.png', ROOM.wallTile, S, ROOM.height), roughness: 1 });
  for (let i = 0; i < 4; i++) {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(S, ROOM.height), wallMat);
    const a = i * Math.PI / 2;                    // each wall faces the centre of the room
    wall.position.set(-Math.sin(a) * ROOM.half, ROOM.floorY + ROOM.height / 2, -Math.cos(a) * ROOM.half);
    wall.rotation.y = a;
    wall.receiveShadow = true;
    room.add(wall);
  }
}
scene.add(room);

// ---------------------------------------------------------------------------
// Paintings: one framed picture on each wall. To swap one, change its file
// here. `width` is in world units (the block is 1.2 wide); height follows the
// picture's own shape. wall: 0 = behind the stone at the start, 1 = left,
// 2 = front (behind the starting camera), 3 = right.
// ---------------------------------------------------------------------------
const PAINTINGS = [
  { file: 'assets/Backdrop Image 3.webp', wall: 0, width: 5.2 },   // bull-leaping fresco
  { file: 'assets/Backdrop Image 1.jpg',  wall: 1, width: 4.4 },   // classical city
  { file: 'assets/Backdrop Image 2.jpg',  wall: 2, width: 2.1 },   // Augustus
  { file: 'assets/Backdrop Image 4.jpg',  wall: 3, width: 2.3 },   // Winged Victory
];
const PAINTING_CENTER_Y = 1.3;      // eye level, a little above the stone
const PAINTING_GLOW = 0.25;         // soft self-light so walls facing away from the sun stay readable
const paintingMats = [];
{
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x8a6a2e, metalness: 0.45, roughness: 0.45 });
  const FRAME = 0.16, DEPTH = 0.08;
  for (const pt of PAINTINGS) {
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.8, emissive: 0xffffff, emissiveIntensity: PAINTING_GLOW });
    paintingMats.push(mat);
    const group = new THREE.Group();
    const a = pt.wall * Math.PI / 2;
    // Same placement as the walls, pulled a hair into the room.
    group.position.set(-Math.sin(a) * (ROOM.half - 0.01), PAINTING_CENTER_Y, -Math.cos(a) * (ROOM.half - 0.01));
    group.rotation.y = a;
    room.add(group);
    new THREE.TextureLoader().load(encodeURI(pt.file), tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      mat.map = mat.emissiveMap = tex;
      mat.needsUpdate = true;
      const w = pt.width, h = w * tex.image.height / tex.image.width;
      const canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      canvasMesh.position.z = 0.02;
      group.add(canvasMesh);
      // Gilded frame: four bars around the picture.
      const bars = [[w + 2 * FRAME, FRAME, 0, (h + FRAME) / 2], [w + 2 * FRAME, FRAME, 0, -(h + FRAME) / 2],
                    [FRAME, h, -(w + FRAME) / 2, 0], [FRAME, h, (w + FRAME) / 2, 0]];
      for (const [bw, bh, x, y] of bars) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, DEPTH), frameMat);
        bar.position.set(x, y, DEPTH / 2);
        group.add(bar);
      }
    });
  }
}

// ---------------------------------------------------------------------------
// Pedestal, built from the drawing in the chat: a square column whose outline
// follows the drawing row by row. PEDESTAL_PROFILE is the drawing's half-width
// in pixels for each row (top to bottom); assets/pedestal.png is each row of
// the drawing stretched to full width, so the carvings wrap each face.
// ---------------------------------------------------------------------------
const PEDESTAL_PROFILE = [39.5, 40.5, 41.5, 41.5, 42.5, 42.5, 43.5, 43.5, 43.5, 43.5, 43.5, 42.5, 42.5, 41.5, 41.5, 40.5, 38.5, 36.5, 31.5, 30.5, 28.5, 28.5, 27.5, 27.5, 26.5, 26.5, 26.5, 25.5, 25.5, 25.5, 25.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 24.5, 25.5, 25.5, 25.5, 25.5, 26.5, 26.5, 26.5, 27.5, 27.5, 28.5, 28.5, 30.5, 31.5, 32.5, 32.5, 32.5, 33.5, 33.5, 33.5, 32.5, 32.5, 32.5, 31.5];
function buildPedestal() {
  const rows = PEDESTAL_PROFILE.length, px = PEDESTAL_HEIGHT / rows;
  // Half-width at each row boundary (average of the rows either side = smoother outline).
  const hwAt = r => px * (r === 0 ? PEDESTAL_PROFILE[0] : r === rows ? PEDESTAL_PROFILE[rows - 1]
                         : (PEDESTAL_PROFILE[r - 1] + PEDESTAL_PROFILE[r]) / 2);
  const pos = [], uv = [], idx = [];
  // Four faces, each its own strip so the corners stay sharp.
  for (const [nx, nz] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
    const tx = -nz, tz = nx, base = pos.length / 3;       // (tx, tz) runs along the face
    for (let r = 0; r <= rows; r++) {
      const h = hwAt(r), y = PEDESTAL_TOP - r * px, v = 1 - r / rows;
      pos.push(nx * h - tx * h, y, nz * h - tz * h,  nx * h + tx * h, y, nz * h + tz * h);
      uv.push(1, v, 0, v);
    }
    for (let r = 0; r < rows; r++) { const a = base + 2 * r; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const tex = new THREE.TextureLoader().load('assets/pedestal.png');
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;                     // crisp carved lines
  const group = new THREE.Group();
  const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 }));
  // Flat top the block stands on (a hair below it so the two don't flicker).
  const h0 = hwAt(0);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(2 * h0, 2 * h0),
    new THREE.MeshStandardMaterial({ color: 0xded5d2, roughness: 0.85 }));
  top.rotation.x = -Math.PI / 2;
  top.position.y = PEDESTAL_TOP - 0.002;
  for (const m of [body, top]) { m.castShadow = true; m.receiveShadow = true; group.add(m); }
  group.userData.topHalf = h0;
  return group;
}
const pedestal = buildPedestal();
scene.add(pedestal);
// Where falling pieces land: the pedestal top if they're over it, else the floor.
function groundAt(x, z) {
  const h = pedestal.userData.topHalf;
  return (Math.abs(x) <= h && Math.abs(z) <= h) ? PEDESTAL_TOP : ROOM.floorY;
}

// Stone material (photo texture + paint + bump): js/stone.js
const clayMaterial = createStoneMaterial(renderer);
const clay = new THREE.Mesh(new THREE.BufferGeometry(), clayMaterial);
clay.castShadow = true;
clay.receiveShadow = true;                        // deep cuts shade themselves
scene.add(clay);

// Upright block: 1.2 wide (x), 2 tall (y), 1 deep (z).
const BLOCK = [1.2, 2, 1];
const volume = new SculptVolume({ size: BLOCK, cell: 0.025 });

function rebuildMesh() {
  const { positions, normals, colors, indices } = volume.mesh();
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geo.setAttribute('paint', new THREE.BufferAttribute(colors, 4, true));   // bytes -> 0..1 in shader
  geo.setIndex(new THREE.BufferAttribute(indices, 1));
  geo.computeBoundingBox();
  geo.computeBoundingSphere();
  clay.geometry.dispose();
  clay.geometry = geo;
}
rebuildMesh();

// Brush preview
const cursor = new THREE.Mesh(
  new THREE.SphereGeometry(1, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0x6fa0ff, wireframe: true, transparent: true, opacity: 0.35 })
);
cursor.visible = false;
scene.add(cursor);

// --- Tool state -------------------------------------------------------------
// Hardness is fixed at a medium stone (it shapes brush feel and chip size).
const tool = { mode: 'chisel', radius: 0.12, strength: 0.5, hardness: 0.5 };
const undoStack = [];
const MAX_UNDO = 30;

const ui = {
  hammerPanel: document.getElementById('hammerPanel'),
  hammerDepth: document.getElementById('hammerDepth'),
  paintPanel: document.getElementById('paintPanel'),
  chiselPanel: document.getElementById('chiselPanel'),
  chiselAngle: document.getElementById('chiselAngle'),
  erase: document.getElementById('btnErase'),
  color: document.getElementById('paintColor'),
  size: document.getElementById('size'),
  strength: document.getElementById('strength'),
};
function setMode(m) {
  tool.mode = m;
  ui.hammerPanel.hidden = m !== 'hammer';
  ui.paintPanel.hidden = m !== 'paint';
  document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === m));
  const toolName = m === 'chisel'
    ? `${chiselState.size[0].toUpperCase()}${chiselState.size.slice(1)} Chisel`
    : TOOL_NAMES[m];
  document.getElementById('toolName').textContent = toolName;
  for (const [name, h] of Object.entries(heldTools)) if (name !== m) h.group.visible = false;
  // Tool strip: highlight the chisel in use (only while the chisel tool is active).
  document.querySelectorAll('[data-chisel]').forEach(b => b.classList.toggle('active', m === 'chisel' && b.dataset.chisel === chiselState.size));
  ui.chiselPanel.hidden = m !== 'chisel';
  document.getElementById('sizeRow').hidden = m === 'chisel' || m === 'hammer';   // they have S/M/L buttons
  if (m !== 'chisel') { chiselModel.visible = false; cancelAim(); }
  if (m !== 'hammer') { hammerModel.visible = false; cancelHammer(); }
  previewGroup.visible = false; previewKey = '';
  updateCursorColor();
  if (typeof tutorialEvent === 'function' && tut) tutorialEvent('mode:' + m);
  updateStatus();
}
function setRadius(r) {
  tool.radius = Math.min(0.4, Math.max(0.05, r));
  ui.size.value = tool.radius;
}
ui.size.oninput = e => setRadius(parseFloat(e.target.value));
ui.strength.oninput = e => { tool.strength = parseFloat(e.target.value); };
const TOOL_NAMES = { chisel: 'Chisel', hammer: 'Hammer', smooth: 'Sandpaper', paint: 'Paint' };
document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.onclick = () => setMode(b.dataset.tool));

// --- Paint settings -----------------------------------------------------------
const paintState = { rgb: [192, 57, 43], erase: false };
function updateCursorColor() {
  if (tool.mode === 'paint') cursor.material.color.set(paintState.erase ? 0xffffff : ui.color.value);
  else if (tool.mode === 'smooth') cursor.material.color.set(0xf0c060);
}
function setPaintColor(hex) {
  ui.color.value = hex;
  const c = parseInt(hex.slice(1), 16);
  paintState.rgb = [(c >> 16) & 255, (c >> 8) & 255, c & 255];
  document.querySelectorAll('.swatches span').forEach(s => s.classList.toggle('active', s.dataset.color === hex));
  setErase(false);
}
function setErase(on) {
  paintState.erase = on;
  ui.erase.classList.toggle('active', on);
  updateCursorColor();
}
document.querySelectorAll('.swatches span').forEach(s => {
  s.style.background = s.dataset.color;
  s.onclick = () => setPaintColor(s.dataset.color);
});
ui.color.oninput = e => setPaintColor(e.target.value);
ui.erase.onclick = () => setErase(!paintState.erase);
setPaintColor(ui.color.value);


document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnReset').onclick = () => {
  pushUndo(); volume.reset(); clearDebris(); rebuildMesh();
  remixOf = null; document.getElementById('remixNote').hidden = true;
};
document.getElementById('btnExport').onclick = exportSTL;

// Each undo step has an id; debris created by that step is tagged with it, so
// undoing a strike also puts the chip back instead of leaving a copy on the floor.
let actionId = 0;
function pushUndo() {
  undoStack.push({ id: ++actionId, snap: volume.snapshot() });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  const step = undoStack.pop();
  volume.restore(step.snap);
  removeDebris(d => d.step === step.id);
  rebuildMesh();
}
function exportSTL() {
  const data = new STLExporter().parse(clay, { binary: true });
  const url = URL.createObjectURL(new Blob([data], { type: 'model/stl' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'sculpture.stl' });
  a.click();
  URL.revokeObjectURL(url);
}

// --- Picking ----------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDirty = false, sculpting = false;

const lastClient = { x: 0, y: 0 };
function updatePointer(e) {
  lastClient.x = e.clientX; lastClient.y = e.clientY;
  const r = canvas.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pick() {
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(clay, false)[0];
  return hit && hit.face ? hit : null;
}

// --- Brush feel ---------------------------------------------------------------
// Hardness does two things, like real stone:
//  1. Each dab removes less material, so deep cuts take several passes.
//  2. The brush lags behind the mouse ("lazy brush"), so it feels heavy and
//     wobbles in your hand get averaged out -> steadier, smoother strokes.
const brushPos = new THREE.Vector3();
const brushNormal = new THREE.Vector3(0, 0, 1);
let lastDab = null, meshDirty = false;

function dabDepth() {   // used by add
  const perDab = tool.radius * 0.2 * tool.strength;
  return tool.mode === 'smooth' ? 0 : perDab * (1 - 0.85 * tool.hardness);
}
function stamp(p) {
  if (tool.mode === 'paint') volume.paintSphere([p.x, p.y, p.z], tool.radius, paintState.rgb, 0.1 + 0.4 * tool.strength, paintState.erase);
  else if (tool.mode === 'smooth') volume.smooth([p.x, p.y, p.z], tool.radius, 0.35 + 0.6 * tool.strength);
  else volume.brush([p.x, p.y, p.z], tool.radius, dabDepth(), tool.mode);
  meshDirty = true;
}
// Lay dabs evenly along the path from the last dab to the brush, so a fast
// flick still leaves a continuous groove instead of dotted pits.
function strokeTo(p) {
  const spacing = tool.radius * 0.15;
  const seg = p.clone().sub(lastDab);
  const len = seg.length();
  if (len < spacing) return;
  seg.divideScalar(len);
  const steps = Math.min(64, Math.floor(len / spacing));
  for (let s = 0; s < steps; s++) {
    lastDab.addScaledVector(seg, spacing);
    stamp(lastDab);
  }
}
// Stone resists the chisel, but not the paintbrush.
function followRate() { return tool.mode === 'paint' ? 30 : 30 * (1 - tool.hardness) + 4; }   // 1/s: snappy clay .. heavy granite

// These listeners are registered BEFORE OrbitControls, so we can switch the
// camera controls off when a drag starts on the clay.
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || cameraMode()) return;   // camera mode: let OrbitControls handle it
  updatePointer(e);
  // Hammer rectangle already set: this click (anywhere) swings the hammer.
  if (tool.mode === 'hammer' && ham.active && !ham.dragging) {
    controls.enabled = false; ham.strikeOnUp = true; canvas.setPointerCapture(e.pointerId); return;
  }
  // Chisel already placed: this click (anywhere) is the strike.
  if (tool.mode === 'chisel' && aim.active && !aim.pressing) {
    controls.enabled = false; aim.strikeOnUp = true; canvas.setPointerCapture(e.pointerId); return;
  }
  const hit = pick();
  if (!hit) return;                       // missed the clay -> let OrbitControls orbit
  controls.enabled = false;
  canvas.setPointerCapture(e.pointerId);
  if (tool.mode === 'chisel') { startAim(hit); aim.pressing = true; aim.downX = e.clientX; aim.downY = e.clientY; return; }
  if (tool.mode === 'hammer') { startHammer(hit); return; }
  sculpting = true;
  pushUndo();                             // one undo step per stroke
  brushPos.copy(hit.point);
  lastDab = hit.point.clone();
  stamp(lastDab);
});
canvas.addEventListener('pointermove', e => { updatePointer(e); pointerDirty = true; });
const endStroke = e => {
  if (tool.mode === 'hammer' && (ham.dragging || ham.strikeOnUp)) {
    controls.enabled = true;
    if (ham.strikeOnUp) { hammerStrike(); return; }
    ham.dragging = false; ham.active = true;               // rectangle set: waiting for the swing
    updateStatus();
    return;
  }
  if (tool.mode === 'chisel' && aim.active) {
    controls.enabled = true;
    if (aim.strikeOnUp) { strikeNow(); return; }                 // second click
    if (aim.pressing) {

// Tool art: each tool's toolbar icon AND its 3D model come from one pixel-art

// the pixel size is detected, the image is trimmed and outlined for the

// Draw each tool like the chisels: transparent background, tool on the
// diagonal, working end (hammer head / brush tip) toward the TOP-RIGHT.
// ---------------------------------------------------------------------------
const TOOL_ART = {
  hammer:    'assets/tool-hammer.png',
  sandpaper: 'assets/tool-sandpaper.png',
  paint:     'assets/tool-paint.png',

//   hold: 'strike' = hammer side-on over the stone, 'angled' = tip on the

const TOOL_MODELS = {
  hammer:    { mode: 'hammer', length: 0.55, depth: 5, hold: 'strike' },
  sandpaper: { mode: 'smooth', length: 1,    depth: 1, hold: 'flat' },    // scaled to the brush size

// Load an image and return its pixels at the art's true resolution.
function loadSprite(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0);
      const { data, width: W, height: H } = g.getImageData(0, 0, c.width, c.height);
      // Pixel-art block size = gcd of every run of identical pixels (works for 1x or 16x art).
      const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
      let k = 0;
      const same = (i, j) => data[i] === data[j] && data[i + 1] === data[j + 1] && data[i + 2] === data[j + 2] && data[i + 3] === data[j + 3];
      for (let y = 0; y < H && k !== 1; y += Math.max(1, (H / 64) | 0)) {
        let run = 1;
        for (let x = 1; x <= W; x++) {
          if (x < W && same((y * W + x) * 4, (y * W + x - 1) * 4)) run++;
          else { if (x < W || run < W) k = gcd(k, run); run = 1; }
        }

      k = k || 1;
      const w = Math.floor(W / k), h = Math.floor(H / k);
      // Sample block centres, then trim to the drawn area.
      const px = [];
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = ((y * k + (k >> 1)) * W + x * k + (k >> 1)) * 4;
        const on = data[i + 3] > 127;
        px.push(on ? [data[i], data[i + 1], data[i + 2]] : null);
        if (on) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      }

      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) pixels.push(px[y * w + x]);

}

function spriteIcon(sp) {

    if (p) { img.data[i] = p[0]; img.data[i + 1] = p[1]; img.data[i + 2] = p[2]; img.data[i + 3] = 255; continue; }

// ---------------------------------------------------------------------------
// Debris: broken-off pieces with simple rigid-body motion (gravity, spin,
// bouncing on the floor, and being pushed out of the block if they hit it).
// ---------------------------------------------------------------------------
const GRAVITY = 6, MAX_DEBRIS = 60;
const debris = [];

// hole before normal physics starts, so it can't snag on the walls it broke from.

  if (piece.count < 4) return false;                   // too small to see: dust only
  const m = SculptVolume.meshGrid(piece);
  if (!m.indices.length) return false;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(m.positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(m.normals, 3));

}

function clearDebris() { removeDebris(() => true); }

function dropFloating() {

  for (const piece of pieces) {
    const drift = new V3((Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3);
    const spin = new V3((Math.random() - 0.5) * 1.5, 0, (Math.random() - 0.5) * 1.5);
    if (!spawnPiece(piece, drift, spin)) {
      const o = piece.origin, h = piece.h, n = piece.n;
      spawnDust(new V3(o[0] + n[0] * h / 2, o[1] + n[1] * h / 2, o[2] + n[2] * h / 2), new V3(0, 1, 0), new V3(1, 0, 0), 10);

function updateDebris(dt) {

    if (d.age > DEBRIS_LIFETIME - SHRINK_TIME) {
      const k = Math.max(0, (DEBRIS_LIFETIME - d.age) / SHRINK_TIME);
      d.group.scale.setScalar(Math.max(1e-4, k * k * (3 - 2 * k)));

        spawnDust(d.group.position, UP, SIDE, 12);
        removeDebris(x => x === d);

    if (d.resting) continue;

    // 1) Ejection: slide straight out of the hole - no gravity, no collisions.
    if (d.eject) {
      const step = Math.min(d.eject.left, d.eject.speed * dt);
      d.group.position.addScaledVector(d.eject.dir, step);
      d.eject.left -= step;
      if (d.eject.left <= 0) d.eject = null;       // clear of the stone: normal physics from here

    const ground = groundAt(d.group.position.x, d.group.position.z);
    if (low < ground) {                            // bounce, then scrape to a stop
      d.group.position.y += ground - low;
      if (d.vel.y < 0) d.vel.y *= -0.3;
      d.vel.x *= 0.6; d.vel.z *= 0.6;
      d.spin.multiplyScalar(0.6);
      if (d.vel.lengthSq() < 0.01 && d.spin.lengthSq() < 0.05) d.resting = true;
    }
  }
}

// Stone dust: a quick puff of particles at the point of impact.
const dustBursts = [];
const dustMat = new THREE.PointsMaterial({ color: 0xc9bfa9, size: 0.018, transparent: true, depthWrite: false });
function spawnDust(p, n, t, count) {
  const pos = new Float32Array(count * 3), vel = [];
  for (let i = 0; i < count; i++) {
    pos[3 * i] = p.x; pos[3 * i + 1] = p.y; pos[3 * i + 2] = p.z;
    vel.push(n.clone().multiplyScalar(0.4 + Math.random()).addScaledVector(t, Math.random() * 0.6)
      .add(new V3().randomDirection().multiplyScalar(0.5)));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, dustMat.clone());
  scene.add(pts);
  dustBursts.push({ pts, vel, age: 0 });
}
function updateDust(dt) {
  for (let b = dustBursts.length - 1; b >= 0; b--) {
    const d = dustBursts[b];
    d.age += dt;
    const P = d.pts.geometry.attributes.position;
    for (let i = 0; i < d.vel.length; i++) {
      d.vel[i].y -= 3 * dt;
      d.vel[i].multiplyScalar(1 - 1.5 * dt);          // air drag
      P.array[3 * i] += d.vel[i].x * dt; P.array[3 * i + 1] = Math.max(groundAt(P.array[3 * i], P.array[3 * i + 2]), P.array[3 * i + 1] + d.vel[i].y * dt); P.array[3 * i + 2] += d.vel[i].z * dt;
    }
    P.needsUpdate = true;
    d.pts.material.opacity = Math.max(0, 1 - d.age / 1.2);
    if (d.age > 1.2) { scene.remove(d.pts); d.pts.geometry.dispose(); d.pts.material.dispose(); dustBursts.splice(b, 1); }
  }
}

// Called every frame while the chisel tool is active.
function updateChisel(dt) {
  cursor.visible = false;
  kick = Math.max(0, kick - dt * 5);
  if (aim.active) {
    if (pointerDirty) { pointerDirty = false; aimFromPointer(); }
    placeChisel(aim.tip, aim.n, aim.t);
    chiselModel.visible = true;
    refreshPreview();
    return;
  }
  if (pointerDirty) {
    pointerDirty = false;
    const hit = pick();
    hover.ok = !!hit;
    if (hit) { hover.tip.copy(hit.point); hover.n.copy(hitNormal(hit)); }
  }
  chiselModel.visible = hover.ok;
  if (hover.ok) {
    const reuse = lastAimDir && lastAimDir.clone().addScaledVector(hover.n, -lastAimDir.dot(hover.n));
    placeChisel(hover.tip, hover.n, reuse && reuse.length() > 0.5 ? reuse.normalize() : defaultHeading(hover.tip, hover.n));
  }
}

const controls = new OrbitControls(camera, canvas);

// --- Camera mode (toggle with V / button, or hold Space) ---------------------
let camToggle = false, spaceHeld = false;

// --- Preset views with a smooth fly-to ---------------------------------------
const VIEWS = {
  home:  new THREE.Vector3(3.2, 1.6, 4.0),
  front: new THREE.Vector3(0, 0, 5),
  side:  new THREE.Vector3(5, 0, 0),
  top:   new THREE.Vector3(0, 5, 0.001),   // tiny z offset avoids a gimbal flip
};
let flight = null;   // { fromPos, toPos, fromTarget, t }
function flyTo(name) {
  zoomGoal = null;
  flight = { fromPos: camera.position.clone(), toPos: VIEWS[name].clone(),
             fromTarget: controls.target.clone(), t: 0 };
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => flyTo(b.dataset.view));
// --- Zoom buttons, slider and +/- keys ----------------------------------------
// These glide smoothly toward a target distance. The slider uses a log scale
// so each step feels the same whether you're far away or up close.
const zoomSlider = document.getElementById('zoomSlider');
const zoomRange = () => Math.log(controls.maxDistance / controls.minDistance);
const distToSlider = d => 100 * Math.log(controls.maxDistance / d) / zoomRange();
const sliderToDist = v => controls.maxDistance * Math.exp(-zoomRange() * v / 100);
let zoomGoal = null;
function zoomTo(dist) {
  zoomGoal = Math.min(controls.maxDistance, Math.max(controls.minDistance, dist));
  flight = null;
}
function zoomStep(factor) { zoomTo((zoomGoal ?? camera.position.distanceTo(controls.target)) * factor); }
function updateZoom(dt) {
  if (zoomGoal !== null) {
    const off = camera.position.clone().sub(controls.target), d = off.length();
    const nd = d + (zoomGoal - d) * (1 - Math.exp(-12 * dt));
    camera.position.copy(controls.target).add(off.setLength(nd));
    if (Math.abs(nd - zoomGoal) < 0.002) zoomGoal = null;
  }
  if (document.activeElement !== zoomSlider) zoomSlider.value = distToSlider(camera.position.distanceTo(controls.target));
}
document.getElementById('zoomIn').onclick = () => zoomStep(0.75);
document.getElementById('zoomOut').onclick = () => zoomStep(1 / 0.75);
zoomSlider.oninput = e => zoomTo(sliderToDist(+e.target.value));
controls.addEventListener('start', () => { zoomGoal = null; });   // wheel / drag takes over

function updateFlight(dt) {
  if (!flight) return;
  flight.t = Math.min(1, flight.t + dt / 0.6);           // 0.6 s flight
  const k = flight.t * flight.t * (3 - 2 * flight.t);    // smoothstep ease
  camera.position.lerpVectors(flight.fromPos, flight.toPos, k);
  controls.target.lerpVectors(flight.fromTarget, new THREE.Vector3(0, 0, 0), k);
  if (flight.t === 1) flight = null;
}

// --- Keyboard orbit (arrow keys) -----------------------------------------------
const held = new Set();
const spherical = new THREE.Spherical();
function keyboardOrbit(dt) {
  const speed = 1.8 * dt;                                // radians per second
  let dTheta = 0, dPhi = 0;
  if (held.has('ArrowLeft'))  dTheta -= speed;
  if (held.has('ArrowRight')) dTheta += speed;
  if (held.has('ArrowUp'))    dPhi -= speed;
  if (held.has('ArrowDown'))  dPhi += speed;
  if (!dTheta && !dPhi) return;
  flight = null;
  const offset = camera.position.clone().sub(controls.target);
  spherical.setFromVector3(offset);
  spherical.theta += dTheta;
  spherical.phi = Math.min(controls.maxPolarAngle, Math.max(0.05, spherical.phi + dPhi));
  camera.position.copy(controls.target).add(offset.setFromSpherical(spherical));
}

addEventListener('keydown', e => {

// --- Main loop: at most one pick/dab per frame keeps it responsive ----------
// ---------------------------------------------------------------------------
// Tutorial - Pygmalion walks new sculptors through the tools.
// Steps with `waitFor` move on by themselves once you do the thing (Next
// still works if you'd rather skip ahead). `cheer` steps pass after a moment.
// `voice` is Pygmalion reading that line (cut from "Pygmalion Tutorial
// Recording.mp3"). Each clip plays only when its step is shown, and stops
// when you move to another step.
// `highlight` puts a pulsing ring on the control the step talks about.
// ---------------------------------------------------------------------------
const TUTORIAL = [
  { voice: 'assets/voice/tutorial-01.mp3', text: 'Salve, I am Pygmalion.' },
  { voice: 'assets/voice/tutorial-02.mp3', text: 'Welcome to my Unexceptionable 100% Authentic Sculpting Experience.' },
  { voice: 'assets/voice/tutorial-03.mp3', text: 'To begin, select the hammer tool in the top left corner of the studio.',
    highlight: '#toolbar [data-tool="hammer"]', waitFor: 'mode:hammer' },
  { voice: 'assets/voice/tutorial-04.mp3', text: 'Click and drag along the stone to shape your strike, use the R and F keys to determine the depth.',
    highlight: '#hammerDepth', waitFor: 'hammerStrike' },
  { voice: 'assets/voice/tutorial-05.mp3', text: 'Ζήτω!', cheer: true, lang: 'el' },
  { voice: 'assets/voice/tutorial-06.mp3', text: 'Next, select the chisel tool.', highlight: '#toolbar [data-chisel]', waitFor: 'mode:chisel' },
  { voice: 'assets/voice/tutorial-07.mp3', text: 'Click and drag along the stone to rotate your strike, use the R and F keys to change its angle.',
    highlight: '#chiselAngle', waitFor: 'chiselStrike' },
  { voice: 'assets/voice/tutorial-08.mp3', text: 'Γιούπι!', cheer: true, lang: 'el' },
  { voice: 'assets/voice/tutorial-09.mp3', text: 'Use the sandpaper tool to smooth out your sculpture and the paint tool to add color.',
    highlight: '#toolbar [data-tool="smooth"], #toolbar [data-tool="paint"]' },
  { voice: 'assets/voice/tutorial-10.mp3', text: 'You can reset with a new piece of stone at any time.', highlight: '#btnReset' },
];
const tut = { step: -1, timer: 0, el: document.getElementById('tutorial') };

// --- Pygmalion's voice ---------------------------------------------------------
const VOICE_KEY = 'pygmalion.voice';
const voiceClips = TUTORIAL.map(st => {
  const a = new Audio(st.voice);
  a.preload = 'auto';
  return a;
});
const voiceBtn = document.getElementById('tutVoice');
let voiceOn = true, voiceBlocked = false, playingClip = null;
try { voiceOn = localStorage.getItem(VOICE_KEY) !== 'off'; } catch { /* private mode */ }
function stopVoice() {
  if (playingClip) { playingClip.pause(); playingClip.onended = null; playingClip = null; }
}
// Play step i's line from the start. onDone runs when it finishes (or right
// away if the voice is off or can't play), so cheers can wait for it.
function playVoice(i, onDone) {
  stopVoice();
  const clip = voiceClips[i];
  if (!voiceOn || !clip) { onDone?.(false); return; }
  clip.currentTime = 0;
  clip.onended = () => { if (playingClip === clip) playingClip = null; onDone?.(true); };
  playingClip = clip;
  clip.play().then(() => { voiceBlocked = false; }).catch(() => {
    // The browser blocks sound until the visitor has clicked something on the
    // page. Try again on their first click or key press.
    if (playingClip === clip) playingClip = null;
    voiceBlocked = true;
    onDone?.(false);
  });
}
function resumeBlockedVoice() {
  if (voiceBlocked && tut.step >= 0 && voiceOn) { voiceBlocked = false; playVoice(tut.step); }
}
addEventListener('pointerdown', resumeBlockedVoice, true);
addEventListener('keydown', resumeBlockedVoice, true);
function setVoice(on) {
  voiceOn = on;
  voiceBtn.setAttribute('aria-pressed', String(on));
  voiceBtn.textContent = on ? '🔊' : '🔇';
  voiceBtn.title = on ? 'Voice on (click to mute)' : 'Voice off (click to unmute)';
  try { localStorage.setItem(VOICE_KEY, on ? 'on' : 'off'); } catch { /* private mode */ }
  if (!on) stopVoice();
  else if (tut.step >= 0) playVoice(tut.step);
}
voiceBtn.onclick = e => { e.currentTarget.blur(); setVoice(!voiceOn); };
setVoice(voiceOn);
const TUT_DONE_KEY = 'pygmalion.tutorialDone';
function showTutorialStep(i) {
  clearTimeout(tut.timer);
  document.querySelectorAll('.tut-highlight').forEach(el => el.classList.remove('tut-highlight'));
  if (i < 0 || i >= TUTORIAL.length) { endTutorial(); return; }
  tut.step = i;
  const st = TUTORIAL[i], text = document.getElementById('tutText');
  text.textContent = st.text;
  text.className = st.cheer ? 'cheer' : '';
  text.lang = st.lang || 'en';
  document.getElementById('tutCount').textContent = `${i + 1} / ${TUTORIAL.length}`;
  document.getElementById('tutBack').hidden = i === 0;
  document.getElementById('tutNext').textContent = i === TUTORIAL.length - 1 ? 'Finish' : 'Next';
  if (st.highlight) document.querySelectorAll(st.highlight).forEach(el => el.classList.add('tut-highlight'));
  // Cheers move on once Pygmalion has finished saying them.
  playVoice(i, spoke => {
    if (st.cheer && tut.step === i) tut.timer = setTimeout(() => showTutorialStep(i + 1), spoke ? 500 : 1800);
  });
  tut.el.hidden = false;
  syncTutorialPosition();
}
function startTutorial() { showTutorialStep(0); }
function endTutorial() {
  clearTimeout(tut.timer);
  stopVoice();
  tut.step = -1;
  tut.el.hidden = true;
  document.querySelectorAll('.tut-highlight').forEach(el => el.classList.remove('tut-highlight'));
  try { localStorage.setItem(TUT_DONE_KEY, '1'); } catch { /* private mode */ }
}
// Called by the tools: 'mode:<tool>', 'hammerStrike', 'chiselStrike'.
function tutorialEvent(name) {
  const st = TUTORIAL[tut.step];
  if (st && st.waitFor === name) showTutorialStep(tut.step + 1);
}
document.getElementById('tutNext').onclick = e => { e.currentTarget.blur(); showTutorialStep(tut.step + 1); };
document.getElementById('tutBack').onclick = e => { e.currentTarget.blur(); showTutorialStep(tut.step - 1); };

// Publishing to the gallery

let remixOf = null;           // set when this sculpture started as someone else's

// Picture for the gallery: a fixed 3/4 view of the block with tools, debris,
// previews hidden (the room stays, as a backdrop). Copies the middle square of the canvas
// straight after rendering (so no preserveDrawingBuffer is needed).
function captureThumbnail(size = 512) {
  const helpers = [cursor, chiselModel, hammerModel, previewGroup, aimArrow,
                   ...Object.values(heldTools).map(h => h.group), ...debris.map(d => d.group), ...dustBursts.map(d => d.pts)];
  const was = helpers.map(o => o.visible);
  helpers.forEach(o => { o.visible = false; });
  const savedPos = camera.position.clone(), savedTarget = controls.target.clone();
  camera.position.set(2.7, 1.3, 3.6).setLength(5.4);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  const src = renderer.domElement, side = Math.min(src.width, src.height);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  c.getContext('2d').drawImage(src, (src.width - side) / 2, (src.height - side) / 2, side, side, 0, 0, size, size);
  helpers.forEach((o, i) => { o.visible = was[i]; });
  camera.position.copy(savedPos); controls.target.copy(savedTarget); camera.lookAt(savedTarget);
  renderer.render(scene, camera);
  // WebP where supported (small); browsers without it hand back PNG.
  return new Promise(res => c.toBlob(b => res(b), 'image/webp', 0.85));
}

// Remix: studio.html?remix=<id> starts from someone else's sculpture.
async function loadRemix() {

setMode('chisel');   // default tool
let tutSeen = false;
try { tutSeen = localStorage.getItem(TUT_DONE_KEY) === '1'; } catch { /* private mode */ }
if (!tutSeen) startTutorial();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  keyboardOrbit(dt);
  updateFlight(dt);
  updateZoom(dt);
  const lim = ROOM.half - 1.5;
  controls.target.x = Math.max(-lim, Math.min(lim, controls.target.x));
  controls.target.z = Math.max(-lim, Math.min(lim, controls.target.z));
  controls.target.y = Math.max(ROOM.floorY + 0.5, Math.min(ROOM.floorY + ROOM.height - 1.5, controls.target.y));
  updateDebris(dt);
  updateDust(dt);
  if (announceUntil && performance.now() > announceUntil) { announceUntil = 0; updateStatus(); }
  if (tool.mode === 'chisel') {
    if (cameraMode()) chiselModel.visible = false; else updateChisel(dt);
  } else if (tool.mode === 'hammer') {
    if (cameraMode()) hammerModel.visible = false; else updateHammer(dt);
  } else if ((pointerDirty || sculpting) && !cameraMode()) {
    pointerDirty = false;
    const hit = pick();
    if (hit) brushNormal.copy(hitNormal(hit));
    if (sculpting) {
      // Brush eases toward the point under the mouse; harder material = more drag.
      if (hit) brushPos.lerp(hit.point, 1 - Math.exp(-followRate() * dt));
      strokeTo(brushPos);
      cursor.visible = true;
      cursor.position.copy(brushPos);
    } else if (hit) {
      cursor.visible = true;
      cursor.position.copy(hit.point);
    } else {
      cursor.visible = false;
    }
    cursor.scale.setScalar(tool.radius);
    // The tool itself (sandpaper sheet / paintbrush) follows the cursor.
    if (cursor.visible) placeHeldTool(tool.mode, cursor.position, brushNormal);
    else if (heldTools[tool.mode]) heldTools[tool.mode].group.visible = false;
  }
  if (meshDirty) { meshDirty = false; rebuildMesh(); }   // one remesh per frame, however many dabs
  controls.update();
  const inset = 0.35;
  camera.position.x = Math.max(-ROOM.half + inset, Math.min(ROOM.half - inset, camera.position.x));
  camera.position.z = Math.max(-ROOM.half + inset, Math.min(ROOM.half - inset, camera.position.z));
  camera.position.y = Math.max(ROOM.floorY + 0.2, Math.min(ROOM.floorY + ROOM.height - 0.2, camera.position.y));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
